<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-page: #f7f4fb;
      --card-bg: #ffffff;
      --card-tint-pink: #fdf2f8;
      --card-tint-mint: #eefcf5;
      --card-tint-lavender: #f3efff;
      --line-color: #d8cee6;
      --line-strong: #9b87bd;
      --text-main: #2f243a;
      --text-sub: #6f627d;
      --btn-lavender: #8b6fd4;
      --btn-lavender-dark: #7355c2;
      --btn-mint: #38b28a;
      --btn-mint-dark: #259470;
      --btn-rose: #e05a77;
      --btn-rose-dark: #c4435f;
      --badge-found: #d9f7ea;
      --badge-found-text: #165b45;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 78px;
      background-color: var(--bg-page);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--line-color);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.35em;
      color: var(--text-main);
    }

    .history-top-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--line-strong);
      background-color: var(--card-tint-lavender);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background-color: var(--btn-rose);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }

    /* メイン */
    .app-main {
      flex: 1;
      padding: 14px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ホーム画面 */
    .home-banner {
      background-color: var(--card-bg);
      border: 2px solid var(--line-color);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    .home-logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.32em;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .home-menu-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .home-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--line-strong);
      background-color: var(--card-tint-lavender);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .home-pill-btn.primary {
      background-color: var(--btn-lavender);
      border-color: var(--btn-lavender-dark);
      color: #ffffff;
    }

    .home-history-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--btn-mint-dark);
      background-color: var(--card-tint-mint);
      color: var(--badge-found-text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .home-notes-box {
      background-color: var(--card-bg);
      border: 2px solid var(--line-color);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .home-note-line {
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* 探す画面 */
    .panel-box {
      background-color: var(--card-bg);
      border: 2px solid var(--line-color);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--line-strong);
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--btn-lavender);
    }

    .btn-decide,
    .btn-inline-action {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--btn-lavender-dark);
      background-color: var(--btn-lavender);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 通知バー：高さを固定してカメラ枠が上下に動かないようにする */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      background-color: var(--badge-found);
      border: 1.5px solid var(--btn-mint);
      color: var(--badge-found-text);
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 7px;
      border-radius: 999px;
      background-color: var(--btn-mint-dark);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }

    .toast-folder-hint {
      font-size: 11px;
      text-decoration: underline;
      font-weight: 700;
    }

    .action-pair-row {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-search-toggle {
      padding: 11px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--btn-lavender-dark);
      background-color: var(--btn-lavender);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-search-toggle.active-stop {
      background-color: var(--btn-rose);
      border-color: var(--btn-rose-dark);
    }

    .btn-search-toggle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-camera-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 11px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--line-strong);
      background-color: var(--card-tint-lavender);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-camera-toggle.is-open {
      background-color: var(--card-tint-mint);
      border-color: var(--btn-mint-dark);
      color: var(--badge-found-text);
    }

    .status-line {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-align: center;
    }

    /* カメラ枠 */
    .camera-box {
      background-color: var(--card-bg);
      border: 2px solid var(--line-color);
      border-radius: 16px;
      padding: 8px;
      transition: border-color 0.2s ease;
    }

    .camera-box.is-searching {
      border-color: var(--btn-mint);
    }

    .camera-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background-color: #231a2c;
    }

    .camera-viewport video,
    .camera-viewport canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-viewport canvas {
      pointer-events: none;
    }

    .camera-closed-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: rgba(35, 26, 44, 0.92);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
    }

    /* 設定画面 */
    .setting-field {
      margin-bottom: 12px;
    }

    .setting-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 5px;
    }

    .btn-qr-toggle {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--line-strong);
      background-color: var(--card-tint-pink);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .btn-qr-toggle.active-stop {
      background-color: var(--btn-rose);
      border-color: var(--btn-rose-dark);
      color: #ffffff;
    }

    #qr-reader {
      margin-bottom: 12px;
      border-radius: 10px;
      overflow: hidden;
    }

    .toggle-option-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--line-color);
      background-color: var(--bg-page);
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .switch-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--line-strong);
      background-color: #e6e0ef;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .switch-btn.is-on {
      background-color: var(--btn-mint);
      border-color: var(--btn-mint-dark);
      color: #ffffff;
    }

    .btn-save-main {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid var(--btn-lavender-dark);
      background-color: var(--btn-lavender);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    /* 下部ナビゲーション（3タブ） */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 25;
      display: flex;
      justify-content: space-around;
      background-color: var(--card-bg);
      border-top: 2px solid var(--line-color);
      padding: 6px 8px;
    }

    .nav-btn {
      flex: 1;
      max-width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      border-radius: 10px;
      border: 1.5px solid transparent;
      background-color: transparent;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn i {
      font-size: 17px;
    }

    .nav-btn.active {
      background-color: var(--card-tint-lavender);
      border-color: var(--line-strong);
      color: var(--text-main);
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(47, 36, 58, 0.45);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 460px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      border: 2px solid var(--line-strong);
      background-color: var(--card-bg);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background-color: var(--card-tint-lavender);
      border-bottom: 1.5px solid var(--line-color);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-back-folder {
      background-color: #ffffff;
      color: var(--text-main);
    }

    .btn-clear-history {
      background-color: var(--card-tint-pink);
      border-color: var(--btn-rose);
      color: var(--btn-rose-dark);
    }

    .btn-close-modal {
      background-color: #ffffff;
      color: var(--text-main);
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: 12px;
      border: 1.5px solid var(--line-color);
      background-color: var(--bg-page);
      text-align: center;
      cursor: pointer;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background-color: #ffffff;
    }

    .folder-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-sub);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background-color: var(--btn-rose);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-sub);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 24px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
      background-color: rgba(35, 26, 44, 0.78);
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 12px;
      border: 2px solid #ffffff;
      background-color: #ffffff;
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <span class="brand-title">F I N D R O N E</span>
      <button type="button" class="history-top-btn" onclick="openHistoryFolder()">
        <i class="bi bi-folder2-open"></i> 発見履歴
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="home-banner">
          <div class="home-logo">F I N D R O N E</div>
          <div class="home-menu-row">
            <button type="button" class="home-pill-btn primary" onclick="goToTab('search')">
              <i class="bi bi-search"></i> 探す
            </button>
            <button type="button" class="home-pill-btn" onclick="goToTab('setting')">
              <i class="bi bi-gear"></i> 設定
            </button>
          </div>
          <button type="button" class="home-history-btn" onclick="openHistoryFolder()">
            <i class="bi bi-folder2-open"></i> 発見履歴
          </button>
        </div>

        <div class="home-notes-box">
          <div class="home-note-line">※ 探したい物体の名前や特徴から物体検知を行います</div>
          <div class="home-note-line">※ サーバID ・ カメラID の設定を行います</div>
          <div class="home-note-line">※ 発見した物体一覧が表示されます</div>
        </div>
      </div>

      <!-- ================= 探す画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="panel-box">
          <div class="input-row">
            <input
              type="text"
              id="targetObject"
              placeholder="探す物体を入力"
              autocomplete="off"
            />
            <button type="button" class="btn-decide" onclick="updateTarget()">
              決定
            </button>
          </div>

          <div
            id="foundToast"
            class="found-toast"
            title="タップして発見履歴を開く"
            onclick="openFoundObjectFolder()"
          >
            <span id="foundToastText"></span>
            <span class="found-toast-meta">
              <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
              <span class="toast-folder-hint">履歴</span>
            </span>
          </div>

          <div class="action-pair-row">
            <button
              type="button"
              id="startButton"
              class="btn-search-toggle"
              onclick="startDetection()"
              disabled
            >
              探索開始
            </button>
            <button
              type="button"
              id="cameraToggleBtn"
              class="btn-camera-toggle is-open"
              onclick="toggleCameraView()"
            >
              <i class="bi bi-camera-video"></i>
              <span id="cameraToggleLabel">閉じる</span>
            </button>
          </div>

          <button
            type="button"
            id="stopButton"
            style="display: none;"
            onclick="stopDetection()"
          >
            探索終了
          </button>

          <div id="status" class="status-line">ステータス: 未接続</div>
        </div>

        <div id="cameraCard" class="camera-box">
          <div class="camera-viewport">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>
            <div id="cameraClosedOverlay" class="camera-closed-overlay" style="display: none;">
              <i class="bi bi-camera-video-off"></i>
              <span>カメラ映像を閉じています</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 設定画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="panel-box">
          <div class="setting-field">
            <label for="serverIp"><i class="bi bi-hdd-network"></i> サーバIDを入力</label>
            <div class="input-row">
              <input
                type="text"
                id="serverIp"
                placeholder="サーバIDを入力（例: https://xxxx.ngrok-free.app）"
              />
              <button type="button" class="btn-inline-action" onclick="connectToServerOnly()">
                接続
              </button>
            </div>
          </div>

          <div class="setting-field">
            <label for="pcIdInput"><i class="bi bi-webcam"></i> カメラIDを入力</label>
            <div class="input-row">
              <input
                type="text"
                id="pcIdInput"
                placeholder="カメラIDを入力"
              />
              <button type="button" class="btn-inline-action" onclick="connectToPC()">
                接続
              </button>
            </div>
          </div>

          <button type="button" id="btn-qr" class="btn-qr-toggle" onclick="toggleQrScanner()">
            <i class="bi bi-qr-code-scan"></i> <span id="qrBtnLabel">QRコード読み取り</span>
          </button>
          <div id="qr-reader" style="display: none;"></div>

          <div class="toggle-option-box">
            <span><i class="bi bi-camera-video"></i> カメラを常時表示</span>
            <button
              type="button"
              id="alwaysCameraBtn"
              class="switch-btn is-on"
              onclick="toggleAlwaysCameraSetting()"
            >
              ON
            </button>
          </div>

          <div class="toggle-option-box">
            <span><i class="bi bi-bell"></i> 通知音</span>
            <button
              type="button"
              id="notifyToggleBtn"
              class="switch-btn"
              onclick="toggleNotificationSetting()"
            >
              OFF
            </button>
          </div>

          <div id="connectionStatus" class="status-line">ステータス: 未接続</div>

          <button type="button" class="btn-save-main" onclick="saveAllSettings()">
            設定を保存
          </button>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-btn active" onclick="goToTab('home')">
        <i class="bi bi-house-door"></i>
        <span>ホーム</span>
      </button>
      <button type="button" id="nav-search" class="nav-btn" onclick="goToTab('search')">
        <i class="bi bi-search"></i>
        <span>探す</span>
      </button>
      <button type="button" id="nav-setting" class="nav-btn" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle">📂 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
