<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-page: #f5f1ed;
      --bg-app: #fcfaf7;
      --bg-surface: #ffffff;
      --bg-muted: #f3eee8;
      --border-soft: #e3dbd2;
      --text-main: #4a4340;
      --text-sub: #8c827d;
      --accent-pink: #e88d9c;
      --accent-pink-bg: #fdf0f2;
      --accent-green: #5ca883;
      --accent-green-bg: #ebf7f0;
      --danger: #d96b78;
      --danger-bg: #fdeef0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
    }

    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 72px;
      background-color: var(--bg-app);
      border-left: 1px solid var(--border-soft);
      border-right: 1px solid var(--border-soft);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .header-title-group i {
      color: var(--accent-pink);
    }

    .header-badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-muted);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background-color: var(--accent-pink);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }

    /* メイン */
    .app-main {
      flex: 1;
      padding: 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ボタン共通 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--bg-muted);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-accent {
      border-color: var(--accent-pink);
      background-color: var(--accent-pink-bg);
      color: #b84b5e;
    }

    .btn-accent:hover:not(:disabled) {
      background-color: #fae1e6;
    }

    .btn.active-stop {
      border-color: var(--danger);
      background-color: var(--danger-bg);
      color: #b43847;
    }

    .btn-sm {
      padding: 10px 14px;
      font-size: 13px;
      white-space: nowrap;
    }

    .btn-block {
      width: 100%;
    }

    /* ホーム画面 */
    .home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
    }

    .drone-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .drone-svg {
      width: 84px;
      height: 68px;
      stroke: var(--accent-pink);
      fill: var(--accent-pink-bg);
      stroke-width: 2.5;
    }

    .home-brand-text {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--text-main);
    }

    .home-menu-stack {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 探す画面 */
    .search-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-status-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-surface);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
    }

    .status-chip.is-active {
      border-color: var(--accent-green);
      background-color: var(--accent-green-bg);
      color: #2f7a56;
    }

    .row-split {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: 14px;
    }

    .input-box::placeholder {
      color: #b5aba5;
    }

    .input-box:focus {
      outline: none;
      border-color: var(--accent-pink);
    }

    /* カメラ枠 */
    .camera-frame-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-surface);
      overflow: hidden;
    }

    .camera-frame-box.is-searching {
      border-color: var(--accent-green);
    }

    .camera-frame-box video,
    .camera-frame-box canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-frame-box canvas {
      pointer-events: none;
    }

    .camera-overlay-center {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(252, 250, 247, 0.82);
    }

    .camera-toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--accent-pink);
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .camera-open-mini-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background-color: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 発見通知バー（高さ固定でレイアウトシフト防止） */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--accent-green);
      background-color: var(--accent-green-bg);
      color: #266949;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 7px;
      border-radius: 999px;
      background-color: var(--accent-green);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }

    .toast-folder-hint {
      font-size: 11px;
      text-decoration: underline;
    }

    .status-line {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      text-align: center;
      min-height: 18px;
    }

    /* 設定画面 */
    .setting-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-row-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-surface);
    }

    .setting-row-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .toggle-pill-btn {
      min-width: 64px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-muted);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle-pill-btn.is-on {
      border-color: var(--accent-green);
      background-color: var(--accent-green-bg);
      color: #266949;
    }

    #qr-reader {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
    }

    /* 下部ナビゲーション */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 25;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-soft);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 5px 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item i {
      font-size: 18px;
    }

    .nav-item.active {
      color: #b84b5e;
      background-color: var(--accent-pink-bg);
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(74, 67, 64, 0.42);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-app);
      color: var(--text-main);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--bg-muted);
      color: var(--text-main);
    }

    .btn-clear-history {
      border-color: var(--danger);
      background-color: var(--danger-bg);
      color: #b43847;
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background-color: var(--bg-surface);
      text-align: center;
      cursor: pointer;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background-color: var(--bg-muted);
    }

    .folder-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-sub);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background-color: var(--danger);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-sub);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 24px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 12px;
      border: 2px solid #ffffff;
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-title-group">
        <i class="bi bi-search-heart"></i>
        <span id="headerTitleText">FINDRONE</span>
      </div>
      <button type="button" class="header-badge-btn" onclick="openHistoryFolder()">
        <i class="bi bi-folder2-open"></i>
        <span>発見履歴</span>
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="home-screen">
          <div class="drone-hero">
            <svg class="drone-svg" viewBox="0 0 100 80" aria-hidden="true">
              <circle cx="22" cy="20" r="12" />
              <circle cx="78" cy="20" r="12" />
              <line x1="31" y1="28" x2="43" y2="39" />
              <line x1="69" y1="28" x2="57" y2="39" />
              <rect x="38" y="36" width="24" height="22" rx="7" />
              <circle cx="50" cy="47" r="4.5" />
              <line x1="42" y1="58" x2="36" y2="68" />
              <line x1="58" y1="58" x2="64" y2="68" />
            </svg>
            <div class="home-brand-text">FINDRONE</div>
          </div>

          <div class="home-menu-stack">
            <button type="button" class="btn btn-accent btn-block" onclick="goToTab('search')">
              <i class="bi bi-search"></i>
              <span>探す</span>
            </button>
            <button type="button" class="btn btn-block" onclick="goToTab('setting')">
              <i class="bi bi-gear"></i>
              <span>設定</span>
            </button>
            <button type="button" class="btn btn-block" onclick="openHistoryFolder()">
              <i class="bi bi-folder2-open"></i>
              <span>発見履歴</span>
            </button>
          </div>
        </div>
      </div>

      <!-- ================= 探す（search）画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="search-screen">
          <div class="search-status-row">
            <div id="searchStatusChip" class="status-chip">
              <span id="searchStatusText">待機中</span>
            </div>
          </div>

          <div class="row-split">
            <input
              type="text"
              id="targetObject"
              class="input-box"
              placeholder="探す物体を入力"
              autocomplete="off"
            />
            <button type="button" class="btn btn-accent btn-sm" onclick="updateTarget()">
              決定
            </button>
          </div>

          <button
            type="button"
            id="startButton"
            class="btn btn-accent btn-block"
            onclick="startDetection()"
            disabled
          >
            探索開始
          </button>

          <button
            type="button"
            id="stopButton"
            style="display: none;"
            onclick="stopDetection()"
          >
            探索終了
          </button>

          <div id="cameraCard" class="camera-frame-box">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>

            <button
              type="button"
              id="cameraToggleBtn"
              class="camera-open-mini-btn"
              onclick="toggleCameraView()"
            >
              <i class="bi bi-camera-video-off"></i>
              <span id="cameraToggleLabel">閉じる</span>
            </button>

            <div id="cameraClosedOverlay" class="camera-overlay-center" style="display: none;">
              <button type="button" class="camera-toggle-pill" onclick="toggleCameraView()">
                <i class="bi bi-camera-video"></i>
                <span>カメラを起動</span>
              </button>
            </div>
          </div>

          <!-- 高さを完全固定し、通知の有無でカメラ枠や下の表示が上下に動かないようにする -->
          <div
            id="foundToast"
            class="found-toast"
            title="タップして発見履歴を開く"
            onclick="openFoundObjectFolder()"
          >
            <span id="foundToastText"></span>
            <span class="found-toast-meta">
              <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
              <span class="toast-folder-hint">履歴</span>
            </span>
          </div>

          <div id="status" class="status-line">ステータス: 未接続</div>
        </div>
      </div>

      <!-- ================= 設定（setting）画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="setting-screen">
          <div class="row-split">
            <input
              type="text"
              id="serverIp"
              class="input-box"
              placeholder="サーバIDを入力"
            />
            <button type="button" class="btn btn-sm" onclick="connectToServerOnly()">
              接続
            </button>
          </div>

          <div class="row-split">
            <input
              type="text"
              id="pcIdInput"
              class="input-box"
              placeholder="カメラIDを入力"
            />
            <button type="button" class="btn btn-sm" onclick="connectToPC()">
              接続
            </button>
          </div>

          <button type="button" id="btn-qr" class="btn btn-block" onclick="toggleQrScanner()">
            <i class="bi bi-qr-code-scan"></i>
            <span id="qrBtnLabel">QRコード読み取り</span>
          </button>
          <div id="qr-reader" style="display: none;"></div>

          <div class="setting-row-box">
            <span class="setting-row-label">通知音</span>
            <button
              type="button"
              id="notifyToggleBtn"
              class="toggle-pill-btn"
              onclick="toggleNotificationSetting()"
            >
              OFF
            </button>
          </div>

          <div class="setting-row-box">
            <span class="setting-row-label">カメラ常時表示</span>
            <button
              type="button"
              id="alwaysCameraBtn"
              class="toggle-pill-btn is-on"
              onclick="toggleAlwaysCameraSetting()"
            >
              ON
            </button>
          </div>

          <button type="button" class="btn btn-accent btn-block" onclick="saveAllSettings()">
            設定を保存
          </button>

          <div id="connectionStatus" class="status-line">ステータス: 未接続</div>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション（ホーム／探す／設定） -->
    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-item active" onclick="goToTab('home')">
        <i class="bi bi-house"></i>
        <span>ホーム</span>
      </button>
      <button type="button" id="nav-search" class="nav-item" onclick="goToTab('search')">
        <i class="bi bi-search"></i>
        <span>探す</span>
      </button>
      <button type="button" id="nav-setting" class="nav-item" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle">📂 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
