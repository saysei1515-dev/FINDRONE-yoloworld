<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FINDRONE</title>
  <!-- PeerJS & QRスキャナー用CDN & アイコンフォント -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-gradient: linear-gradient(160deg, #fff5f9 0%, #f3ecff 52%, #edf8ff 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: #ffd8e6;
      --text-main: #533f52;
      --text-sub: #846881;
      --accent-mint: linear-gradient(135deg, #a6f0dd 0%, #68cbb3 100%);
      --accent-mint-text: #16493d;
      --accent-pink: linear-gradient(135deg, #ffc4d6 0%, #ff9ebb 100%);
      --accent-lavender: linear-gradient(135deg, #eae0f7 0%, #cfc1e6 100%);
      --accent-sky: linear-gradient(135deg, #bfeaff 0%, #76c8f2 100%);
      --accent-amber: linear-gradient(135deg, #ffe39e 0%, #ffc94d 100%);
      --btn-shadow-soft: 0 5px 14px rgba(176, 134, 162, 0.22);
      --btn-shadow-strong: 0 8px 20px rgba(145, 112, 142, 0.28);
    }

    body {
      margin: 0;
      padding: 10px 14px calc(env(safe-area-inset-bottom, 24px) + 80px);
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* タブ切り替え制御 */
    .tab-content {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      animation: fadeIn 0.2s ease;
    }

    .tab-content.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* トップタイトル */
    .app-header {
      text-align: center;
      margin: 8px 0 12px;
      font-size: 13px;
      letter-spacing: 2.5px;
      color: var(--text-sub);
      font-weight: 800;
      text-transform: uppercase;
    }

    /* 統一感のあるガラスカード */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2px solid var(--card-border);
      border-radius: 28px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 12px 28px rgba(206, 156, 188, 0.2);
    }

    /* ホームロゴ＆バッジ＆ドローン画像 */
    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
      color: #216152;
      background: #e6fbf4;
      border: 1.5px solid #aee9d7;
      border-radius: 9999px;
      padding: 4px 12px;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #4f3d4d;
      font-family: monospace;
    }

    .home-drone-img {
      width: 150px;
      max-width: 68%;
      height: auto;
      max-height: 120px;
      object-fit: contain;
      border-radius: 18px;
      margin-top: 4px;
      filter: drop-shadow(0 6px 14px rgba(176, 134, 162, 0.22));
    }

    /* 入力フォーム類 */
    .input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-icon {
      font-size: 19px;
      color: #8c6e88;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #ffffff;
      border: 2px solid #f0cde0;
      border-radius: 9999px;
      padding: 10px 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      box-shadow: inset 0 2px 5px rgba(214, 166, 194, 0.14);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder {
      color: #b49ab0;
    }

    input[type="text"]:focus {
      border-color: #f28cb8;
      box-shadow: 0 0 0 4px rgba(242, 140, 184, 0.18);
    }

    /* 通知音スイッチカード */
    .notify-setting-box {
      width: 100%;
      background: #fff7fb;
      border: 2px solid #f5d3e4;
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(214, 166, 194, 0.12);
    }

    .notify-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .notify-label-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* スライド式トグルスイッチ */
    .switch-btn {
      position: relative;
      width: 68px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      background: #dfd8eb;
      color: #5b4d69;
      font-size: 11px;
      font-weight: 800;
      justify-content: flex-end;
      box-shadow: inset 0 2px 5px rgba(90, 70, 105, 0.16), 0 4px 10px rgba(160, 140, 180, 0.2);
      transition: background 0.22s ease, justify-content 0.22s ease, box-shadow 0.22s ease;
    }

    .switch-btn::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(80, 55, 85, 0.25);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .switch-btn.is-on {
      background: linear-gradient(135deg, #98ebd6 0%, #59c4aa 100%);
      color: #14473b;
      justify-content: flex-start;
      box-shadow: inset 0 2px 5px rgba(24, 96, 79, 0.14), 0 5px 12px rgba(89, 196, 170, 0.32);
    }

    .switch-btn.is-on::before {
      transform: translate(34px, -50%);
    }

    /* 押せるボタン共通スタイル（影をつけてわかりやすく） */
    button {
      font-family: inherit;
      border: 2px solid rgba(255, 255, 255, 0.92);
      border-radius: 9999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: var(--btn-shadow-soft);
      transition: transform 0.12s ease, box-shadow 0.16s ease, filter 0.16s ease, background 0.2s ease, color 0.2s ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.03);
      box-shadow: var(--btn-shadow-strong);
    }

    button:active:not(:disabled) {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 2px 6px rgba(155, 115, 145, 0.2);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ホーム画面の大型ボタン */
    .btn-massive {
      width: 84%;
      max-width: 270px;
      padding: 16px 24px;
      font-size: 16px;
      box-shadow: var(--btn-shadow-strong);
    }

    .btn-find {
      background: var(--accent-mint);
      color: var(--accent-mint-text);
    }

    .btn-settings-link {
      background: var(--accent-lavender);
      color: #4f415e;
    }

    /* 汎用ボタン */
    .btn-decision {
      background: linear-gradient(135deg, #bef5b1 0%, #86d672 100%);
      color: #224719;
      padding: 10px 18px;
    }

    .btn-save {
      background: var(--accent-sky);
      color: #103e50;
      font-size: 15px;
      width: 78%;
      max-width: 280px;
      padding: 13px 24px;
      box-shadow: 0 7px 18px rgba(86, 185, 235, 0.34);
    }

    .btn-connect {
      background: linear-gradient(135deg, #c6e7ff 0%, #8bc0fa 100%);
      color: #243952;
      padding: 10px 16px;
      font-size: 13px;
    }

    /* 探索開始・停止トグルボタン */
    #startButton {
      background: var(--accent-amber);
      color: #5e460e;
      width: 100%;
      padding: 13px;
      font-size: 16px;
      box-shadow: 0 7px 18px rgba(245, 195, 78, 0.34);
    }

    #startButton.active-stop {
      background: var(--accent-pink) !important;
      color: #6b2234 !important;
      box-shadow: 0 7px 18px rgba(245, 145, 175, 0.36) !important;
    }

    /* QRコードトグル */
    .btn-qr-toggle {
      width: 100%;
      background: linear-gradient(135deg, #e7fbf0 0%, #b5efd1 100%);
      color: #1d573c;
    }

    .btn-qr-toggle.active-stop {
      background: linear-gradient(135deg, #fff0f3 0%, #ffc9d4 100%) !important;
      color: #841435 !important;
    }

    /* QRリーダー */
    #qr-reader {
      width: 100%;
      max-width: 260px;
      min-height: 240px;
      margin: 6px auto;
      padding: 6px;
      display: none;
      background: #ffffff;
      border-radius: 20px;
      border: 2px solid #ffd2e2;
      box-shadow: 0 6px 16px rgba(225, 165, 195, 0.18);
    }

    #qr-reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 14px;
    }

    /* カメラ・プレビューファインダー + コーナーガイド */
    .viewfinder-outer {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #fff2f7;
      border-radius: 24px;
      overflow: hidden;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 22px rgba(202, 152, 184, 0.18);
    }

    .viewfinder-outer::before,
    .viewfinder-outer::after {
      content: "";
      position: absolute;
      inset: 10px;
      pointer-events: none;
      z-index: 2;
      border-radius: 14px;
      border: 2px dashed rgba(114, 198, 178, 0.45);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    /* ステータスバッジ */
    .status-area {
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: #7d587a;
      background: #fdf4fb;
      border: 1.5px solid #f3d7ea;
      border-radius: 9999px;
      padding: 6px 14px;
      margin: 0;
      max-width: 100%;
    }

    /* 履歴フォルダボタン */
    #folderBtn {
      position: relative;
      background: linear-gradient(135deg, #c9eeff 0%, #a5d5ff 100%);
      color: #1f4868;
      width: 100%;
      padding: 12px;
      font-size: 14px;
    }

    /* 発見した物体一覧の右上に表示する未読写真枚数バッジ */
    .folder-unread-badge {
      display: none;
      position: absolute;
      top: -8px;
      right: 8px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 9999px;
      background: #ff5c77;
      color: #ffffff;
      border: 2px solid #ffffff;
      font-size: 11px;
      font-weight: 800;
      line-height: 18px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(190, 45, 75, 0.35);
    }

    /* 発見した物体一覧の下に表示する通知バナー */
    #foundToast {
      display: none;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border: 2px solid #8ce3ce;
      border-radius: 20px;
      padding: 12px 16px;
      color: #1c4a3a;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(114, 211, 189, 0.24);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toast-message-text {
      flex: 1;
      text-align: center;
    }

    /* 通知バナー右端に表示する検出個数バッジ */
    .toast-count-badge {
      display: none;
      flex-shrink: 0;
      min-width: 26px;
      height: 22px;
      padding: 0 7px;
      border-radius: 9999px;
      background: #ff7b93;
      color: #ffffff;
      border: 1.5px solid #ffffff;
      font-size: 11px;
      font-weight: 800;
      line-height: 19px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(180, 60, 85, 0.28);
    }

    /* フッター固定ナビゲーション */
    .nav-bar {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-top: 1.5px solid #ffdce8;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 10px calc(env(safe-area-inset-bottom, 24px) + 8px);
      box-shadow: 0 -6px 22px rgba(204, 154, 184, 0.16);
      z-index: 1000;
    }

    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      color: #b59db1;
      font-size: 10px;
      font-weight: 800;
      padding: 6px 14px;
      gap: 3px;
      box-shadow: none;
      border-radius: 16px;
    }

    .nav-item:hover:not(:disabled),
    .nav-item:active:not(:disabled) {
      box-shadow: none;
      filter: none;
      transform: none;
    }

    .nav-item i {
      font-size: 21px;
    }

    .nav-item.active {
      color: #2b8a73;
      background: #e9fbf5;
    }

    /* 履歴モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(85, 68, 85, 0.45);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: #fffbfd;
      width: 90%;
      max-width: 480px;
      height: 75%;
      border-radius: 26px;
      border: 3px solid #ffdae7;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(175, 125, 155, 0.25);
    }

    .modal-header {
      background: #fff1f5;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #ffd4e4;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      color: #7c4c64;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-clear {
      padding: 6px 12px;
      background: linear-gradient(135deg, #ffc2cc 0%, #ffabb7 100%);
      color: #6d242e;
      font-size: 11px;
    }

    .btn-close {
      padding: 6px 12px;
      background: linear-gradient(135deg, #e4d8f3 0%, #ccc2e3 100%);
      color: #493b5e;
      font-size: 11px;
    }

    .btn-back-folder {
      padding: 6px 12px;
      background: linear-gradient(135deg, #dff7ee 0%, #bcebe0 100%);
      color: #20574a;
      font-size: 11px;
    }

    #imageGallery {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .folder-card {
      position: relative;
      background: #fff6fa;
      border: 2px solid #ffd5e5;
      border-radius: 18px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(214, 166, 194, 0.15);
    }

    .folder-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #ffffff;
      background: #f4eeff;
    }

    .folder-name {
      font-size: 12px;
      font-weight: 700;
      color: #5c475a;
      text-align: center;
      word-break: break-all;
    }

    .folder-count {
      font-size: 10px;
      color: #92758e;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      align-content: start;
    }

    .photo-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      width: 100%;
      max-width: 112px;
    }

    .photo-thumb-box {
      position: relative;
      width: 92px;
      height: 92px;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      border: 2.5px solid #a8ebd9;
      cursor: pointer;
      display: block;
    }

    .photo-time-label {
      font-size: 9px;
      font-weight: 700;
      color: #7c5c77;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #f2d4e3;
      border-radius: 10px;
      padding: 2px 6px;
      line-height: 1.3;
      text-align: center;
      word-break: break-all;
    }

    /* 隅につける ❌ 削除ボタン */
    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 9999px;
      border: 2px solid #ffffff;
      background: #ff7b93;
      color: #ffffff;
      font-size: 11px;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(180, 60, 85, 0.35);
      z-index: 2;
    }

    .empty-history-msg {
      text-align: center;
      color: #9e879b;
      font-size: 13px;
      margin-top: 28px;
    }

    /* プレビューモーダル */
    #imagePreviewModal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(72, 55, 75, 0.75);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #previewImage {
      max-width: 88%;
      max-height: 76%;
      border-radius: 22px;
      border: 3.5px solid #a8ebd9;
      object-fit: contain;
      background: #ffffff;
    }

    .preview-hint {
      color: #5c475a;
      margin-top: 15px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 16px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <!-- ================= ① HOME タブ ================= -->
  <div id="homeTab" class="tab-content active">
    <div class="app-header">Home</div>

    <div class="glass-card" style="padding: 32px 14px; gap: 26px;">
      <div class="brand-block">
        <span class="brand-badge"><i class="bi bi-radar"></i> OBJECT FINDER</span>
        <div class="brand-title">FINDRONE</div>
        <img id="homeDroneImg" class="home-drone-img" src="drone.png" alt="FINDRONE ドローン" />
      </div>

      <button class="btn-massive btn-find" onclick="goToTab('search')">
        <i class="bi bi-search"></i> 落とし物を探す
      </button>

      <button class="btn-massive btn-settings-link" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i> 設定
      </button>
    </div>
  </div>

  <!-- ================= ② SEARCH タブ ================= -->
  <div id="searchTab" class="tab-content">
    <div class="app-header">search</div>

    <div class="glass-card">
      <!-- 検索ワード（初期値は空欄） -->
      <div class="input-wrapper">
        <input type="text" id="targetObject" value="" placeholder="探す物体を入力してください" autocomplete="off" />
        <button class="btn-decision" onclick="updateTarget()">決定</button>
      </div>

      <!-- 探索開始／探索終了ボタン（トグル式） -->
      <button id="startButton" onclick="startDetection()" disabled>探索開始</button>
      <!-- 隠し（既存の停止システムとの整合用） -->
      <button id="stopButton" onclick="stopDetection()" style="display: none;"></button>

      <!-- カメラ映像エリア -->
      <div class="viewfinder-outer">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
      </div>

      <!-- ステータス表示 -->
      <div class="status-area" id="status">ステータス: PCと接続してください</div>

      <!-- フォルダボタン（右上に未読追加枚数バッジ） -->
      <button id="folderBtn" onclick="openHistoryFolder()">
        📂 発見した物体一覧
        <span id="unreadPhotosBadge" class="folder-unread-badge">0</span>
      </button>

      <!-- 発見通知バナー（発見した物体一覧の下に表示・右端に検出個数バッジ） -->
      <div id="foundToast">
        <span id="foundToastText" class="toast-message-text"></span>
        <span id="detectedCountBadge" class="toast-count-badge">×0</span>
      </div>
    </div>
  </div>

  <!-- ================= ③ SETTING タブ ================= -->
  <div id="settingTab" class="tab-content">
    <div class="app-header">setting</div>

    <div class="glass-card">
      <!-- サーバーURL -->
      <div class="input-wrapper">
        <span class="input-icon"><i class="bi bi-laptop"></i></span>
        <input type="text" id="serverIp" placeholder="IPアドレスまたはURLを入力してください" />
        <button class="btn-connect" onclick="connectToServerOnly()">接続</button>
      </div>

      <!-- PCカメラ Peer ID -->
      <div class="input-wrapper">
        <span class="input-icon"><i class="bi bi-camera"></i></span>
        <input type="text" id="pcIdInput" placeholder="カメラのIDを入力してください" />
        <button class="btn-connect" onclick="connectToPC()">接続</button>
      </div>

      <!-- QRカメラ（カメラ接続欄と通知設定の間） -->
      <button id="btn-qr" class="btn-qr-toggle" onclick="toggleQrScanner()"><i class="bi bi-qr-code-scan"></i> QRコードカメラ起動</button>
      <div id="qr-reader"></div>

      <!-- 通知音設定（スライドスイッチ） -->
      <div class="notify-setting-box">
        <div class="notify-toggle-row">
          <span class="notify-label-group"><i class="bi bi-bell-fill"></i> 通知音</span>
          <button type="button" id="notifyToggleBtn" class="switch-btn" onclick="toggleNotificationSetting()">OFF</button>
        </div>
      </div>

      <div class="status-area" id="connectionStatus">ステータス: 未接続</div>

      <!-- 設定保存ボタン -->
      <button class="btn-save" onclick="saveAllSettings()"><i class="bi bi-floppy"></i> この設定で保存</button>
    </div>
  </div>

  <!-- ================= 底部の固定ナビゲーションバー ================= -->
  <div class="nav-bar">
    <button id="nav-home" class="nav-item active" onclick="goToTab('home')">
      <i class="bi bi-house"></i>
      <span>Home</span>
    </button>
    <button id="nav-search" class="nav-item" onclick="goToTab('search')">
      <i class="bi bi-search"></i>
      <span>search</span>
    </button>
    <button id="nav-setting" class="nav-item" onclick="goToTab('setting')">
      <i class="bi bi-gear"></i>
      <span>setting</span>
    </button>
  </div>

  <!-- モーダル（フォルダ） -->
  <div id="historyFolderModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="historyModalTitle">📂 発見した物体一覧</h3>
        <div style="display: flex; gap: 6px;">
          <button id="backToFoldersBtn" class="btn-back-folder" onclick="backToFolderList()" style="display: none;">← 一覧</button>
          <button class="btn-clear" onclick="clearGallery()">履歴クリア</button>
          <button class="btn-close" onclick="closeHistoryFolder()">✕ 閉じる</button>
        </div>
      </div>
      <div id="imageGallery"></div>
    </div>
  </div>

  <!-- プレビュー -->
  <div id="imagePreviewModal" onclick="closePreview()">
    <img id="previewImage">
    <div id="previewFoundTime" class="preview-hint" style="margin-top: 10px; display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
