<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-cream: #fffaf5;
      --bg-card: #ffffff;
      --bg-soft: #fdf2f8;
      --bg-input: #fffdf9;
      --border-pastel: #f3d5e3;
      --border-lavender: #dcd2f7;
      --accent-pink: #ff85b3;
      --accent-pink-soft: #ffe4ef;
      --accent-lavender: #9b87f5;
      --accent-lavender-soft: #ede9fe;
      --accent-mint: #34d399;
      --accent-mint-soft: #d1fae5;
      --danger: #fb7185;
      --danger-soft: #ffe4e6;
      --text-main: #4a3f55;
      --text-sub: #8b7d9b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background-color: #f7eef5;
      color: var(--text-main);
      min-height: 100vh;
    }

    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
      background: linear-gradient(180deg, #fff6fa 0%, var(--bg-cream) 45%, #f5f9ff 100%);
      box-shadow: 0 12px 36px rgba(155, 135, 245, 0.12);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background-color: rgba(255, 250, 245, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1.5px solid var(--border-pastel);
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text-main);
    }

    .header-title-group i {
      color: var(--accent-pink);
      font-size: 18px;
    }

    .header-badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1.5px solid var(--border-lavender);
      background-color: var(--bg-card);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(155, 135, 245, 0.12);
    }

    .unread-badge {
      padding: 1px 7px;
      border-radius: 999px;
      background-color: var(--accent-pink);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
    }

    /* メイン */
    .app-main {
      flex: 1;
      padding: 18px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ボタン共通 */
    .cute-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--border-lavender);
      background-color: var(--bg-card);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(155, 135, 245, 0.12);
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .cute-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .cute-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .cute-btn-primary {
      border-color: var(--accent-pink);
      background: linear-gradient(135deg, #ff9ec4 0%, #ff7eb0 100%);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(255, 133, 179, 0.32);
    }

    .cute-btn.active-stop {
      border-color: var(--danger);
      background-color: var(--danger-soft);
      color: #be123c;
      box-shadow: none;
    }

    .cute-btn-sm {
      padding: 10px 15px;
      font-size: 13px;
      white-space: nowrap;
    }

    .cute-btn-block {
      width: 100%;
    }

    /* ホーム画面 */
    .home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 6px;
    }

    .drone-hero {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 18px;
      margin-bottom: 20px;
      border-radius: 24px;
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-pastel);
      box-shadow: 0 8px 24px rgba(255, 133, 179, 0.12);
    }

    .drone-svg {
      width: 88px;
      height: 72px;
      stroke: var(--accent-pink);
      fill: var(--accent-pink-soft);
      stroke-width: 2.6;
    }

    .home-brand-text {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text-main);
    }

    .home-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .home-menu-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .home-menu-card {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border-pastel);
      background-color: var(--bg-card);
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(155, 135, 245, 0.08);
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .home-menu-card:hover {
      border-color: var(--accent-pink);
      transform: translateY(-1px);
    }

    .home-menu-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .home-menu-icon {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--accent-pink-soft);
      color: #e11d74;
      font-size: 17px;
      flex-shrink: 0;
    }

    .home-menu-icon.lavender {
      background-color: var(--accent-lavender-soft);
      color: #6d28d9;
    }

    .home-menu-icon.mint {
      background-color: var(--accent-mint-soft);
      color: #059669;
    }

    .home-menu-title {
      font-size: 14px;
      font-weight: 700;
    }

    .home-menu-desc {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* 探す画面 */
    .search-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-lavender);
      background-color: var(--bg-card);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
    }

    .status-chip.is-active {
      border-color: var(--accent-mint);
      background-color: var(--accent-mint-soft);
      color: #047857;
    }

    .row-split {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cute-input {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border-pastel);
      background-color: var(--bg-input);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
    }

    .cute-input::placeholder {
      color: #b7a8c7;
    }

    .cute-input:focus {
      outline: none;
      border-color: var(--accent-pink);
    }

    /* カメラ枠 */
    .camera-frame-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 22px;
      border: 2px solid var(--border-pastel);
      background-color: var(--bg-card);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(155, 135, 245, 0.12);
    }

    .camera-frame-box.is-searching {
      border-color: var(--accent-mint);
      box-shadow: 0 8px 24px rgba(52, 211, 153, 0.24);
    }

    .camera-frame-box video,
    .camera-frame-box canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-frame-box canvas {
      pointer-events: none;
    }

    .camera-overlay-center {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: rgba(255, 250, 245, 0.78);
      backdrop-filter: blur(4px);
    }

    .camera-toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1.5px solid var(--accent-pink);
      background-color: var(--bg-card);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 133, 179, 0.2);
    }

    .camera-open-mini-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--border-pastel);
      background-color: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 発見通知バー（高さ固定でレイアウトシフト防止） */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1.5px solid var(--accent-mint);
      background-color: var(--accent-mint-soft);
      color: #065f46;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background-color: var(--accent-mint);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
    }

    .toast-folder-hint {
      font-size: 11px;
      text-decoration: underline;
      color: #047857;
    }

    .status-line {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-align: center;
      min-height: 18px;
    }

    /* 設定画面 */
    .setting-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-card {
      padding: 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border-pastel);
      background-color: var(--bg-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(155, 135, 245, 0.08);
    }

    .setting-row-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border-pastel);
      background-color: var(--bg-card);
      box-shadow: 0 4px 14px rgba(155, 135, 245, 0.08);
    }

    .setting-row-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* app.js の toggleNotificationSetting / toggleAlwaysCameraSetting と直接連動するトグルボタン */
    .switch-toggle-btn {
      min-width: 72px;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--border-lavender);
      background-color: #f3effc;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .switch-toggle-btn.is-on {
      border-color: var(--accent-mint);
      background-color: var(--accent-mint-soft);
      color: #047857;
      box-shadow: 0 3px 10px rgba(52, 211, 153, 0.25);
    }

    #qr-reader {
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid var(--border-lavender);
    }

    /* 下部ナビゲーション */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 25;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background-color: rgba(255, 250, 245, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1.5px solid var(--border-pastel);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 8px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-item i {
      font-size: 18px;
    }

    .nav-item.active {
      color: #e11d74;
      background-color: var(--accent-pink-soft);
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(74, 63, 85, 0.45);
      backdrop-filter: blur(4px);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      border: 1.5px solid var(--border-pastel);
      background-color: var(--bg-cream);
      color: var(--text-main);
      overflow: hidden;
      box-shadow: 0 14px 32px rgba(74, 63, 85, 0.2);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-pastel);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-lavender);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--bg-soft);
      color: var(--text-main);
    }

    .btn-clear-history {
      border-color: var(--danger);
      background-color: var(--danger-soft);
      color: #be123c;
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: 16px;
      border: 1.5px solid var(--border-pastel);
      background-color: var(--bg-card);
      text-align: center;
      cursor: pointer;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      background-color: var(--bg-soft);
    }

    .folder-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-sub);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 1.5px solid var(--border-pastel);
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background-color: var(--danger);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-sub);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 24px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 18px;
      border: 2.5px solid #ffffff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-pastel);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-title-group">
        <i class="bi bi-stars"></i>
        <span id="headerTitleText">FINDRONE</span>
      </div>
      <button type="button" class="header-badge-btn" onclick="openHistoryFolder()">
        <i class="bi bi-folder-heart"></i>
        <span>発見履歴</span>
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="home-screen">
          <div class="drone-hero">
            <svg class="drone-svg" viewBox="0 0 100 80" aria-hidden="true">
              <circle cx="22" cy="20" r="12" />
              <circle cx="78" cy="20" r="12" />
              <line x1="31" y1="28" x2="43" y2="39" />
              <line x1="69" y1="28" x2="57" y2="39" />
              <rect x="38" y="36" width="24" height="22" rx="8" />
              <circle cx="50" cy="47" r="4.5" />
              <line x1="42" y1="58" x2="36" y2="68" />
              <line x1="58" y1="58" x2="64" y2="68" />
            </svg>
            <div class="home-brand-text">FINDRONE</div>
            <div class="home-subtitle">ほっこり物体さがしサポート</div>
          </div>

          <div class="home-menu-list">
            <button type="button" class="home-menu-card" onclick="goToTab('search')">
              <div class="home-menu-left">
                <div class="home-menu-icon"><i class="bi bi-search-heart"></i></div>
                <div>
                  <div class="home-menu-title">探す</div>
                  <div class="home-menu-desc">探したい物体の名前から検知します</div>
                </div>
              </div>
              <i class="bi bi-chevron-right"></i>
            </button>

            <button type="button" class="home-menu-card" onclick="goToTab('setting')">
              <div class="home-menu-left">
                <div class="home-menu-icon lavender"><i class="bi bi-sliders2-vertical"></i></div>
                <div>
                  <div class="home-menu-title">設定</div>
                  <div class="home-menu-desc">サーバID・カメラID・通知音・表示設定</div>
                </div>
              </div>
              <i class="bi bi-chevron-right"></i>
            </button>

            <button type="button" class="home-menu-card" onclick="openHistoryFolder()">
              <div class="home-menu-left">
                <div class="home-menu-icon mint"><i class="bi bi-folder-heart"></i></div>
                <div>
                  <div class="home-menu-title">発見履歴</div>
                  <div class="home-menu-desc">見つけた物体の写真をまとめて確認</div>
                </div>
              </div>
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- ================= 探す（search）画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="search-screen">
          <div class="search-top-bar">
            <div id="searchStatusChip" class="status-chip">
              <span id="searchStatusText">待機中</span>
            </div>
          </div>

          <div class="row-split">
            <input
              type="text"
              id="targetObject"
              class="cute-input"
              placeholder="探す物体を入力"
              autocomplete="off"
            />
            <button type="button" class="cute-btn cute-btn-primary cute-btn-sm" onclick="updateTarget()">
              決定
            </button>
          </div>

          <button
            type="button"
            id="startButton"
            class="cute-btn cute-btn-primary cute-btn-block"
            onclick="startDetection()"
            disabled
          >
            探索開始
          </button>

          <button
            type="button"
            id="stopButton"
            style="display: none;"
            onclick="stopDetection()"
          >
            探索終了
          </button>

          <div id="cameraCard" class="camera-frame-box">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>

            <button
              type="button"
              id="cameraToggleBtn"
              class="camera-open-mini-btn"
              onclick="toggleCameraView()"
            >
              <i class="bi bi-camera-video-off"></i>
              <span id="cameraToggleLabel">閉じる</span>
            </button>

            <div id="cameraClosedOverlay" class="camera-overlay-center" style="display: none;">
              <button type="button" class="camera-toggle-pill" onclick="toggleCameraView()">
                <i class="bi bi-camera-video"></i>
                <span>カメラを起動</span>
              </button>
            </div>
          </div>

          <!-- 高さを完全固定し、通知の有無でカメラ枠や下の表示が上下に動かないようにする -->
          <div
            id="foundToast"
            class="found-toast"
            title="タップして発見履歴を開く"
            onclick="openFoundObjectFolder()"
          >
            <span id="foundToastText"></span>
            <span class="found-toast-meta">
              <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
              <span class="toast-folder-hint">履歴</span>
            </span>
          </div>

          <div id="status" class="status-line">ステータス: 未接続</div>
        </div>
      </div>

      <!-- ================= 設定（setting）画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="setting-screen">
          <div class="setting-card">
            <div class="row-split">
              <input
                type="text"
                id="serverIp"
                class="cute-input"
                placeholder="サーバIDを入力"
              />
              <button type="button" class="cute-btn cute-btn-sm" onclick="connectToServerOnly()">
                接続
              </button>
            </div>

            <div class="row-split">
              <input
                type="text"
                id="pcIdInput"
                class="cute-input"
                placeholder="カメラIDを入力"
              />
              <button type="button" class="cute-btn cute-btn-sm" onclick="connectToPC()">
                接続
              </button>
            </div>

            <button type="button" id="btn-qr" class="cute-btn cute-btn-block" onclick="toggleQrScanner()">
              <i class="bi bi-qr-code-scan"></i>
              <span id="qrBtnLabel">QRコード読み取り</span>
            </button>
            <div id="qr-reader" style="display: none;"></div>
          </div>

          <div class="setting-row-box">
            <span class="setting-row-label">通知音</span>
            <button
              type="button"
              id="notifyToggleBtn"
              class="switch-toggle-btn"
              onclick="toggleNotificationSetting()"
            >
              OFF
            </button>
          </div>

          <div class="setting-row-box">
            <span class="setting-row-label">カメラ常時表示</span>
            <button
              type="button"
              id="alwaysCameraBtn"
              class="switch-toggle-btn is-on"
              onclick="toggleAlwaysCameraSetting()"
            >
              ON
            </button>
          </div>

          <button type="button" class="cute-btn cute-btn-primary cute-btn-block" onclick="saveAllSettings()">
            設定を保存
          </button>

          <div id="connectionStatus" class="status-line">ステータス: 未接続</div>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション（ホーム／探す／設定） -->
    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-item active" onclick="goToTab('home')">
        <i class="bi bi-house-heart"></i>
        <span>ホーム</span>
      </button>
      <button type="button" id="nav-search" class="nav-item" onclick="goToTab('search')">
        <i class="bi bi-search-heart"></i>
        <span>探す</span>
      </button>
      <button type="button" id="nav-setting" class="nav-item" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle">📂 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
