<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-teal-dark: #073f44;
      --bg-teal-card: #0a5258;
      --bg-teal-input: #07464c;
      --neon-cyan: #3df5dc;
      --neon-cyan-bright: #7affec;
      --neon-mint: #38f29d;
      --neon-glow: 0 0 8px rgba(61, 245, 220, 0.45), inset 0 0 6px rgba(61, 245, 220, 0.16);
      --danger-rose: #ff5c8a;
      --danger-bg: rgba(255, 92, 138, 0.18);
      --text-neon: #e6fffb;
      --text-muted: #9ad8d0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background-color: #052e32;
      color: var(--text-neon);
      min-height: 100vh;
    }

    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 74px;
      background: linear-gradient(180deg, #0b5a60 0%, var(--bg-teal-dark) 100%);
      border-left: 1px solid rgba(61, 245, 220, 0.22);
      border-right: 1px solid rgba(61, 245, 220, 0.22);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: rgba(7, 63, 68, 0.94);
      border-bottom: 1.5px solid var(--neon-cyan);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--neon-cyan-bright);
      text-shadow: 0 0 8px rgba(61, 245, 220, 0.4);
    }

    .header-badge-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--neon-cyan);
      background-color: var(--bg-teal-card);
      color: var(--text-neon);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--neon-glow);
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background-color: var(--neon-mint);
      color: #052e32;
      font-size: 11px;
      font-weight: 800;
    }

    /* メイン */
    .app-main {
      flex: 1;
      padding: 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ネオン枠ボタン共通 */
    .neon-outline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--neon-cyan);
      background-color: rgba(10, 82, 88, 0.72);
      color: var(--text-neon);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--neon-glow);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .neon-outline-btn:active:not(:disabled) {
      transform: scale(0.98);
      background-color: rgba(61, 245, 220, 0.22);
    }

    .neon-outline-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .neon-outline-btn.is-active-stop {
      border-color: var(--danger-rose);
      background-color: var(--danger-bg);
      color: #ffd6e2;
      box-shadow: 0 0 10px rgba(255, 92, 138, 0.4);
    }

    .neon-outline-btn.is-on {
      border-color: var(--neon-mint);
      background-color: rgba(56, 242, 157, 0.22);
      color: #b8ffdf;
      box-shadow: 0 0 10px rgba(56, 242, 157, 0.4);
    }

    /* ホーム画面 */
    .home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
    }

    .drone-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
      color: var(--neon-cyan-bright);
      text-shadow: 0 0 12px rgba(61, 245, 220, 0.5);
    }

    .drone-svg {
      width: 92px;
      height: 76px;
      stroke: var(--neon-cyan-bright);
      fill: none;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(61, 245, 220, 0.55));
    }

    .home-brand-text {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    .home-menu-stack {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .home-menu-btn {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
    }

    .home-caption {
      margin: 4px 0 12px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--text-muted);
      text-align: center;
    }

    /* 探す画面 */
    .search-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row-split {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .neon-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--neon-cyan);
      background-color: var(--bg-teal-input);
      color: var(--text-neon);
      font-size: 14px;
      font-weight: 600;
      box-shadow: inset 0 0 6px rgba(61, 245, 220, 0.15);
    }

    .neon-input::placeholder {
      color: rgba(154, 216, 208, 0.65);
    }

    .neon-input:focus {
      outline: none;
      border-color: var(--neon-cyan-bright);
      box-shadow: var(--neon-glow);
    }

    .btn-small-neon {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    .btn-full-neon {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
    }

    /* カメラ枠（画像中央の大きめ枠） */
    .camera-frame-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      border: 1.5px solid var(--neon-cyan);
      background-color: #062c30;
      overflow: hidden;
      box-shadow: var(--neon-glow);
    }

    .camera-frame-box.is-searching {
      border-color: var(--neon-mint);
      box-shadow: 0 0 14px rgba(56, 242, 157, 0.55), inset 0 0 8px rgba(56, 242, 157, 0.25);
    }

    .camera-frame-box video,
    .camera-frame-box canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-frame-box canvas {
      pointer-events: none;
    }

    .camera-overlay-center {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: rgba(6, 44, 48, 0.65);
    }

    .camera-toggle-pill {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1.5px solid var(--neon-cyan-bright);
      background-color: rgba(10, 82, 88, 0.9);
      color: var(--text-neon);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--neon-glow);
    }

    .camera-open-mini-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 6;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--neon-cyan);
      background-color: rgba(7, 63, 68, 0.88);
      color: var(--neon-cyan-bright);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 発見通知バー：高さを固定してカメラ枠や下のボタンが上下に動かないようにする */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1.5px solid var(--neon-mint);
      background-color: rgba(56, 242, 157, 0.18);
      color: #b8ffdf;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(56, 242, 157, 0.3);
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 7px;
      border-radius: 999px;
      background-color: var(--neon-mint);
      color: #052e32;
      font-size: 11px;
      font-weight: 800;
    }

    .toast-folder-hint {
      font-size: 11px;
      text-decoration: underline;
      color: var(--neon-cyan-bright);
    }

    .status-line {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }

    /* 設定画面 */
    .setting-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-row-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--neon-cyan);
      background-color: rgba(10, 82, 88, 0.72);
      box-shadow: var(--neon-glow);
    }

    .setting-row-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-neon);
    }

    .on-off-pair {
      display: inline-flex;
      gap: 8px;
    }

    .mode-pill {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid rgba(61, 245, 220, 0.5);
      background-color: var(--bg-teal-input);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-pill.is-selected {
      border-color: var(--neon-mint);
      background-color: rgba(56, 242, 157, 0.25);
      color: #b8ffdf;
      box-shadow: 0 0 8px rgba(56, 242, 157, 0.45);
    }

    #qr-reader {
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid var(--neon-cyan);
    }

    /* 下部ナビゲーション（画像下部のアイコンバー） */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 25;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background-color: rgba(7, 63, 68, 0.96);
      border-top: 1.5px solid var(--neon-cyan);
    }

    .nav-icon-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-icon-btn i {
      font-size: 20px;
    }

    .nav-icon-btn.active {
      color: var(--neon-cyan-bright);
      text-shadow: 0 0 8px rgba(61, 245, 220, 0.7);
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(3, 25, 28, 0.72);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      border: 1.5px solid var(--neon-cyan);
      background-color: var(--bg-teal-dark);
      color: var(--text-neon);
      box-shadow: var(--neon-glow);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background-color: var(--bg-teal-card);
      border-bottom: 1px solid rgba(61, 245, 220, 0.4);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      color: var(--neon-cyan-bright);
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--neon-cyan);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--bg-teal-input);
      color: var(--text-neon);
    }

    .btn-clear-history {
      border-color: var(--danger-rose);
      color: #ffd6e2;
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(61, 245, 220, 0.5);
      background-color: var(--bg-teal-card);
      text-align: center;
      cursor: pointer;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background-color: #062c30;
    }

    .folder-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-muted);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(61, 245, 220, 0.4);
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background-color: var(--danger-rose);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 12px;
      border: 2px solid var(--neon-cyan);
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background-color: var(--bg-teal-card);
      border: 1px solid var(--neon-cyan);
      color: var(--text-neon);
      font-size: 12px;
      font-weight: 700;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-title-group">
        <i class="bi bi-bounding-box-circles"></i>
        <span id="headerTitleText">FINDRONE</span>
      </div>
      <button type="button" class="header-badge-btn" onclick="openHistoryFolder()">
        <i class="bi bi-folder2-open"></i>
        <span>発見履歴</span>
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="home-screen">
          <div class="drone-hero">
            <svg class="drone-svg" viewBox="0 0 100 80" aria-hidden="true">
              <circle cx="22" cy="20" r="13" />
              <circle cx="78" cy="20" r="13" />
              <line x1="32" y1="29" x2="43" y2="39" />
              <line x1="68" y1="29" x2="57" y2="39" />
              <rect x="38" y="36" width="24" height="22" rx="6" />
              <circle cx="50" cy="47" r="5" />
              <line x1="42" y1="58" x2="36" y2="68" />
              <line x1="58" y1="58" x2="64" y2="68" />
            </svg>
            <div class="home-brand-text">FINDRONE</div>
          </div>

          <div class="home-menu-stack">
            <button type="button" class="neon-outline-btn home-menu-btn" onclick="goToTab('search')">
              <i class="bi bi-search"></i> 探す
            </button>
            <p class="home-caption">※探したい物体の名前や特徴から物体検知を行います</p>

            <button type="button" class="neon-outline-btn home-menu-btn" onclick="goToTab('setting')">
              <i class="bi bi-gear"></i> 設定
            </button>
            <p class="home-caption">※サーバID・カメラIDの設定を行います</p>

            <button type="button" class="neon-outline-btn home-menu-btn" onclick="openHistoryFolder()">
              <i class="bi bi-folder2-open"></i> 発見履歴
            </button>
            <p class="home-caption">※発見した物体一覧が表示されます</p>
          </div>
        </div>
      </div>

      <!-- ================= 探す（search）画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="search-screen">
          <div class="row-split">
            <input
              type="text"
              id="targetObject"
              class="neon-input"
              placeholder="探す物体を入力"
              autocomplete="off"
            />
            <button type="button" class="neon-outline-btn btn-small-neon" onclick="updateTarget()">
              決定
            </button>
          </div>

          <button
            type="button"
            id="startButton"
            class="neon-outline-btn btn-full-neon"
            onclick="startDetection()"
            disabled
          >
            探索開始
          </button>

          <button
            type="button"
            id="stopButton"
            style="display: none;"
            onclick="stopDetection()"
          >
            探索終了
          </button>

          <div id="cameraCard" class="camera-frame-box">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>

            <button
              type="button"
              id="cameraToggleBtn"
              class="camera-open-mini-btn"
              onclick="toggleCameraView()"
            >
              <span id="cameraToggleLabel">閉じる</span>
            </button>

            <div id="cameraClosedOverlay" class="camera-overlay-center" style="display: none;">
              <button type="button" class="camera-toggle-pill" onclick="toggleCameraView()">
                カメラを起動 ／ 閉じる
              </button>
            </div>
          </div>

          <!-- 高さを完全固定し、通知の有無でカメラ枠や下のボタンが上下に動かないようにする -->
          <div
            id="foundToast"
            class="found-toast"
            title="タップして発見履歴を開く"
            onclick="openFoundObjectFolder()"
          >
            <span id="foundToastText"></span>
            <span class="found-toast-meta">
              <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
              <span class="toast-folder-hint">履歴</span>
            </span>
          </div>

          <button type="button" class="neon-outline-btn btn-full-neon" onclick="openHistoryFolder()">
            <i class="bi bi-folder2-open"></i> 発見履歴
          </button>

          <div id="status" class="status-line">ステータス: 未接続</div>
        </div>
      </div>

      <!-- ================= 設定（setting）画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="setting-screen">
          <div class="row-split">
            <input
              type="text"
              id="serverIp"
              class="neon-input"
              placeholder="サーバIDを入力"
            />
            <button type="button" class="neon-outline-btn btn-small-neon" onclick="connectToServerOnly()">
              接続
            </button>
          </div>

          <div class="row-split">
            <input
              type="text"
              id="pcIdInput"
              class="neon-input"
              placeholder="カメラIDを入力"
            />
            <button type="button" class="neon-outline-btn btn-small-neon" onclick="connectToPC()">
              接続
            </button>
          </div>

          <button type="button" id="btn-qr" class="neon-outline-btn btn-full-neon" onclick="toggleQrScanner()">
            <i class="bi bi-qr-code-scan"></i>
            <span id="qrBtnLabel">QRコード読み取り ／ 停止</span>
          </button>
          <div id="qr-reader" style="display: none;"></div>

          <div class="setting-row-box">
            <span class="setting-row-label">通知音</span>
            <div class="on-off-pair">
              <button
                type="button"
                id="notifyOnBtn"
                class="mode-pill"
                onclick="setNotificationEnabled(true)"
              >
                ON
              </button>
              <button
                type="button"
                id="notifyOffBtn"
                class="mode-pill is-selected"
                onclick="setNotificationEnabled(false)"
              >
                OFF
              </button>
              <button
                type="button"
                id="notifyToggleBtn"
                style="display: none;"
                onclick="toggleNotificationSetting()"
              >
                OFF
              </button>
            </div>
          </div>

          <div class="setting-row-box">
            <span class="setting-row-label">カメラ常時表示</span>
            <div class="on-off-pair">
              <button
                type="button"
                id="alwaysCamOnBtn"
                class="mode-pill is-selected"
                onclick="setAlwaysCameraEnabled(true)"
              >
                ON
              </button>
              <button
                type="button"
                id="alwaysCamOffBtn"
                class="mode-pill"
                onclick="setAlwaysCameraEnabled(false)"
              >
                OFF
              </button>
              <button
                type="button"
                id="alwaysCameraBtn"
                style="display: none;"
                onclick="toggleAlwaysCameraSetting()"
              >
                ON
              </button>
            </div>
          </div>

          <button type="button" class="neon-outline-btn btn-full-neon" onclick="saveAllSettings()">
            設定を保存
          </button>

          <button type="button" class="neon-outline-btn btn-full-neon" onclick="openHistoryFolder()">
            <i class="bi bi-folder2-open"></i> 発見履歴
          </button>

          <div id="connectionStatus" class="status-line">ステータス: 未接続</div>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション（ホーム／探す／設定） -->
    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-icon-btn active" onclick="goToTab('home')">
        <i class="bi bi-bounding-box-circles"></i>
        <span>home</span>
      </button>
      <button type="button" id="nav-search" class="nav-icon-btn" onclick="goToTab('search')">
        <i class="bi bi-search"></i>
        <span>search</span>
      </button>
      <button type="button" id="nav-setting" class="nav-icon-btn" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i>
        <span>setting</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle">📂 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
