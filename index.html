<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-subtle: #f8fafc;
      --border-hairline: #e2e8f0;
      --border-focus: #2563eb;
      --ink-primary: #0f172a;
      --ink-secondary: #64748b;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-blue-soft: #eff6ff;
      --accent-emerald: #10b981;
      --accent-emerald-dark: #047857;
      --accent-emerald-soft: #ecfdf5;
      --accent-rose: #e11d48;
      --accent-rose-soft: #fff1f2;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background-color: var(--bg-subtle);
      color: var(--ink-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 76px;
      background-color: var(--bg-white);
      border-left: 1px solid var(--border-hairline);
      border-right: 1px solid var(--border-hairline);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background-color: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-hairline);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background-color: var(--accent-blue-soft);
      color: var(--accent-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--ink-primary);
    }

    .history-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-white);
      color: var(--ink-primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .history-btn i {
      font-size: 15px;
      color: var(--accent-blue);
    }

    .history-btn:hover {
      border-color: #cbd5e1;
      background-color: var(--bg-subtle);
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background-color: var(--accent-emerald);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }

    /* メイン */
    .app-main {
      flex: 1;
      padding: 18px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ホーム画面 */
    .home-card {
      border: 1px solid var(--border-hairline);
      border-radius: 20px;
      padding: 24px 18px;
      background-color: var(--bg-white);
      box-shadow: var(--shadow-sm);
    }

    .home-hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .drone-logo-box {
      width: 84px;
      height: 84px;
      margin: 0 auto 10px;
      border-radius: 20px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .drone-logo-img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
    }

    .drone-fallback-icon {
      font-size: 36px;
      color: var(--accent-blue);
    }

    .home-hero h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.28em;
      color: var(--ink-primary);
    }

    .home-menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .home-menu-item {
      border: 1px solid var(--border-hairline);
      border-radius: 16px;
      padding: 12px 14px;
      background-color: var(--bg-subtle);
    }

    .home-icon-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-white);
      color: var(--ink-primary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .home-icon-btn:hover {
      border-color: var(--accent-blue);
    }

    .home-icon-btn.primary {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #ffffff;
    }

    .home-icon-btn.primary:hover {
      background-color: var(--accent-blue-hover);
      border-color: var(--accent-blue-hover);
    }

    .home-btn-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--accent-blue-soft);
      color: var(--accent-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .home-icon-btn.primary .home-btn-icon-wrap {
      background-color: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .home-btn-text-group {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-btn-label {
      font-size: 15px;
      font-weight: 800;
    }

    .home-caption {
      margin: 8px 4px 0;
      font-size: 11.5px;
      color: var(--ink-secondary);
      line-height: 1.45;
    }

    /* 探す画面 */
    .search-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .clean-input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-white);
      color: var(--ink-primary);
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .clean-input::placeholder {
      color: #94a3b8;
    }

    .clean-input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid var(--accent-blue);
      background-color: var(--accent-blue);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary i {
      font-size: 16px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-blue-hover);
      border-color: var(--accent-blue-hover);
    }

    .btn-primary:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-primary.is-stop {
      background-color: var(--accent-rose);
      border-color: var(--accent-rose);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-white);
      color: var(--ink-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .btn-secondary i {
      font-size: 17px;
      color: var(--accent-blue);
    }

    .btn-secondary:hover {
      background-color: var(--bg-subtle);
      border-color: #cbd5e1;
    }

    .btn-secondary.is-camera-open {
      border-color: var(--accent-emerald);
      background-color: var(--accent-emerald-soft);
      color: var(--accent-emerald-dark);
    }

    .btn-secondary.is-camera-open i {
      color: var(--accent-emerald-dark);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 8px;
    }

    /* カメラ枠 */
    .camera-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      border: 1px solid var(--border-hairline);
      background-color: #0f172a;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .camera-stage.is-searching {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .camera-stage video,
    .camera-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-stage canvas {
      pointer-events: none;
    }

    .camera-closed-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #f8fafc;
      color: var(--ink-secondary);
      font-size: 13px;
      font-weight: 600;
    }

    .camera-closed-layer i {
      font-size: 28px;
      color: #94a3b8;
    }

    /* 発見通知バー：高さを完全固定してカメラ枠や下の要素が上下に動かないようにする */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid #a7f3d0;
      background-color: var(--accent-emerald-soft);
      color: var(--accent-emerald-dark);
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 7px;
      border-radius: 999px;
      background-color: var(--accent-emerald);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }

    .toast-folder-hint {
      font-size: 11px;
      text-decoration: underline;
      font-weight: 700;
    }

    .status-caption {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      text-align: center;
      min-height: 18px;
    }

    /* 設定画面 */
    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-secondary);
      margin-bottom: 6px;
    }

    .setting-group label i {
      font-size: 14px;
      color: var(--accent-blue);
    }

    .setting-switch-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-subtle);
    }

    .setting-switch-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .setting-icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background-color: var(--bg-white);
      border: 1px solid var(--border-hairline);
      color: var(--accent-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .setting-switch-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .setting-switch-sub {
      font-size: 11px;
      color: var(--ink-secondary);
      margin-top: 2px;
    }

    .seg-pair {
      display: inline-flex;
      border: 1px solid var(--border-hairline);
      border-radius: 9px;
      background-color: var(--bg-white);
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }

    .seg-btn {
      padding: 5px 11px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .seg-btn.is-selected {
      background-color: var(--accent-emerald);
      color: #ffffff;
    }

    #qr-reader {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-hairline);
    }

    /* 下部ナビゲーション（3タブ） */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 25;
      display: flex;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-hairline);
      padding: 6px 8px;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .nav-btn i {
      font-size: 19px;
    }

    .nav-btn.active {
      color: var(--accent-blue);
      background-color: var(--accent-blue-soft);
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(15, 23, 42, 0.45);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 460px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-white);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-hairline);
      background-color: var(--bg-subtle);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-hairline);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--bg-white);
      color: var(--ink-primary);
    }

    .btn-clear-history {
      border-color: #fecdd3;
      background-color: var(--accent-rose-soft);
      color: var(--accent-rose);
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-subtle);
      text-align: center;
      cursor: pointer;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background-color: var(--bg-white);
    }

    .folder-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .folder-count {
      font-size: 11px;
      color: var(--ink-secondary);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-hairline);
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background-color: var(--accent-rose);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--ink-secondary);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--ink-secondary);
      padding: 24px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 12px;
      border: 2px solid #ffffff;
      background-color: #ffffff;
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background-color: #ffffff;
      color: var(--ink-primary);
      font-size: 12px;
      font-weight: 700;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-group">
        <span class="brand-mark"><i class="bi bi-bounding-box-circles"></i></span>
        <span class="brand-name">FINDRONE</span>
      </div>
      <button type="button" class="history-btn" onclick="openHistoryFolder()" title="発見履歴">
        <i class="bi bi-folder2-open"></i>
        <span>発見履歴</span>
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="home-card">
          <div class="home-hero">
            <div class="drone-logo-box">
              <img
                src="drone.png"
                alt="FINDRONE ドローンアイコン"
                class="drone-logo-img"
                onerror="this.style.display='none'; document.getElementById('droneFallbackIcon').style.display='inline-flex';"
              />
              <span id="droneFallbackIcon" class="drone-fallback-icon" style="display: none;">
                <i class="bi bi-bounding-box-circles"></i>
              </span>
            </div>
            <h1>FINDRONE</h1>
          </div>

          <div class="home-menu-list">
            <div class="home-menu-item">
              <button type="button" class="home-icon-btn primary" onclick="goToTab('search')">
                <span class="home-btn-icon-wrap"><i class="bi bi-search"></i></span>
                <span class="home-btn-text-group">
                  <span class="home-btn-label">探す</span>
                  <i class="bi bi-chevron-right"></i>
                </span>
              </button>
              <p class="home-caption">※探したい物体の名前や特徴から物体検知を行います</p>
            </div>

            <div class="home-menu-item">
              <button type="button" class="home-icon-btn" onclick="goToTab('setting')">
                <span class="home-btn-icon-wrap"><i class="bi bi-gear-fill"></i></span>
                <span class="home-btn-text-group">
                  <span class="home-btn-label">設定</span>
                  <i class="bi bi-chevron-right"></i>
                </span>
              </button>
              <p class="home-caption">※サーバID・カメラIDの設定を行います</p>
            </div>

            <div class="home-menu-item">
              <button type="button" class="home-icon-btn" onclick="openHistoryFolder()">
                <span class="home-btn-icon-wrap"><i class="bi bi-folder2-open"></i></span>
                <span class="home-btn-text-group">
                  <span class="home-btn-label">発見履歴</span>
                  <i class="bi bi-chevron-right"></i>
                </span>
              </button>
              <p class="home-caption">※発見した物体一覧が表示されます</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 探す画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="search-stack">
          <div class="input-row">
            <input
              type="text"
              id="targetObject"
              class="clean-input"
              placeholder="探す物体を入力"
              autocomplete="off"
            />
            <button type="button" class="btn-primary" onclick="updateTarget()" title="決定">
              <i class="bi bi-check-lg"></i>
              <span>決定</span>
            </button>
          </div>

          <div class="controls-grid">
            <button
              type="button"
              id="startButton"
              class="btn-primary"
              onclick="startDetection()"
              disabled
            >
              <i class="bi bi-play-fill"></i>
              <span>探索開始</span>
            </button>
            <button
              type="button"
              id="cameraToggleBtn"
              class="btn-secondary is-camera-open"
              onclick="toggleCameraView()"
            >
              <i class="bi bi-camera-video-off"></i>
              <span id="cameraToggleLabel">閉じる</span>
            </button>
          </div>

          <button
            type="button"
            id="stopButton"
            style="display: none;"
            onclick="stopDetection()"
          >
            探索終了
          </button>

          <div id="cameraCard" class="camera-stage">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>
            <div id="cameraClosedOverlay" class="camera-closed-layer" style="display: none;">
              <i class="bi bi-camera-video-off"></i>
              <span>カメラ映像を閉じています</span>
            </div>
          </div>

          <!-- 高さを完全固定し、通知の有無でカメラ枠や下の要素が上下に動かないようにする -->
          <div
            id="foundToast"
            class="found-toast"
            title="タップして発見履歴を開く"
            onclick="openFoundObjectFolder()"
          >
            <span id="foundToastText"></span>
            <span class="found-toast-meta">
              <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
              <span class="toast-folder-hint">履歴</span>
            </span>
          </div>

          <div id="status" class="status-caption">ステータス: 未接続</div>
        </div>
      </div>

      <!-- ================= 設定画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="settings-stack">
          <div class="setting-group">
            <label for="serverIp"><i class="bi bi-hdd-network-fill"></i> サーバID</label>
            <div class="input-row">
              <input
                type="text"
                id="serverIp"
                class="clean-input"
                placeholder="サーバIDを入力"
              />
              <button type="button" class="btn-primary" onclick="connectToServerOnly()" title="接続">
                <i class="bi bi-plug-fill"></i>
                <span>接続</span>
              </button>
            </div>
          </div>

          <div class="setting-group">
            <label for="pcIdInput"><i class="bi bi-webcam-fill"></i> カメラID</label>
            <div class="input-row">
              <input
                type="text"
                id="pcIdInput"
                class="clean-input"
                placeholder="カメラIDを入力"
              />
              <button type="button" class="btn-primary" onclick="connectToPC()" title="接続">
                <i class="bi bi-plug-fill"></i>
                <span>接続</span>
              </button>
            </div>
          </div>

          <button type="button" id="btn-qr" class="btn-secondary" onclick="toggleQrScanner()">
            <i class="bi bi-qr-code-scan"></i>
            <span id="qrBtnLabel">QRコード読み取り</span>
          </button>
          <div id="qr-reader" style="display: none;"></div>

          <div class="setting-switch-card">
            <div class="setting-switch-left">
              <span class="setting-icon-badge"><i class="bi bi-camera-video-fill"></i></span>
              <div>
                <div class="setting-switch-title">カメラ常時表示</div>
                <div class="setting-switch-sub">探す画面を開いたときに映像を表示</div>
              </div>
            </div>
            <div class="seg-pair">
              <button
                type="button"
                id="alwaysCamOnBtn"
                class="seg-btn is-selected"
                onclick="setAlwaysCameraEnabled(true)"
              >
                ON
              </button>
              <button
                type="button"
                id="alwaysCamOffBtn"
                class="seg-btn"
                onclick="setAlwaysCameraEnabled(false)"
              >
                OFF
              </button>
              <button
                type="button"
                id="alwaysCameraBtn"
                style="display: none;"
                onclick="toggleAlwaysCameraSetting()"
              >
                ON
              </button>
            </div>
          </div>

          <div class="setting-switch-card">
            <div class="setting-switch-left">
              <span class="setting-icon-badge"><i class="bi bi-bell-fill"></i></span>
              <div>
                <div class="setting-switch-title">通知音</div>
                <div class="setting-switch-sub">物体を発見したときにサウンド再生</div>
              </div>
            </div>
            <div class="seg-pair">
              <button
                type="button"
                id="notifyOnBtn"
                class="seg-btn"
                onclick="setNotificationEnabled(true)"
              >
                ON
              </button>
              <button
                type="button"
                id="notifyOffBtn"
                class="seg-btn is-selected"
                onclick="setNotificationEnabled(false)"
              >
                OFF
              </button>
              <button
                type="button"
                id="notifyToggleBtn"
                style="display: none;"
                onclick="toggleNotificationSetting()"
              >
                OFF
              </button>
            </div>
          </div>

          <div id="connectionStatus" class="status-caption">ステータス: 未接続</div>

          <button type="button" class="btn-primary" style="width: 100%; padding: 13px;" onclick="saveAllSettings()">
            <i class="bi bi-check2-circle"></i>
            <span>設定を保存</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション（3タブ） -->
    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-btn active" onclick="goToTab('home')" title="ホーム">
        <i class="bi bi-house-door-fill"></i>
        <span>ホーム</span>
      </button>
      <button type="button" id="nav-search" class="nav-btn" onclick="goToTab('search')" title="探す">
        <i class="bi bi-search"></i>
        <span>探す</span>
      </button>
      <button type="button" id="nav-setting" class="nav-btn" onclick="goToTab('setting')" title="設定">
        <i class="bi bi-gear-fill"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle">📂 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
