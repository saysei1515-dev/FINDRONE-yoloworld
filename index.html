<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      /* 指定パレット基準 */
      --pal-accent: #28A6A5;
      --pal-accent-light: #34B8B6;
      --pal-accent-deep: #1B7E7D;
      --pal-accent-depth: #125B5A;
      --pal-accent-soft-top: #EBF8F8;
      --pal-accent-soft-bot: #D5EFEF;
      --pal-accent-soft-border: #A7DCDB;
      --pal-accent-soft-depth: #74C3C2;

      --pal-primary: #F9FCFD;
      --pal-sand-tint: #F6EFEA;
      --card-white: #FFFFFF;
      --card-soft: #F3F9FA;
      --border-soft: #DCEAED;

      --pal-text: #082627;
      --pal-text-sub: #446365;
      --pal-dark-mid: #14393B;
      --pal-dark-light: #225457;
      --pal-dark-soft: #E4ECEC;
      --pal-dark-border: #B6C9CA;

      --shadow-card: 0 12px 28px rgba(8, 38, 39, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background: linear-gradient(160deg, var(--pal-primary) 0%, #EEF7F8 52%, var(--pal-sand-tint) 100%);
      color: var(--pal-text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
      background: linear-gradient(180deg, rgba(249, 252, 253, 0.82) 0%, rgba(246, 239, 234, 0.72) 100%);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: rgba(249, 252, 253, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      box-shadow: 0 4px 16px rgba(8, 38, 39, 0.05);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-drone-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
    }

    .header-drone-fallback {
      font-size: 21px;
      color: var(--pal-accent);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--pal-accent);
    }

    .history-top-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--pal-accent-soft-border);
      background: linear-gradient(180deg, #FFFFFF 0%, var(--pal-accent-soft-top) 100%);
      color: var(--pal-text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 var(--pal-accent-soft-depth), 0 6px 12px rgba(40, 166, 165, 0.14);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .history-top-btn i {
      font-size: 15px;
      color: var(--pal-accent);
    }

    .history-top-btn:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 0 var(--pal-accent-soft-depth), 0 2px 6px rgba(40, 166, 165, 0.1);
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--pal-accent-light) 0%, var(--pal-accent) 100%);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
    }

    /* メイン */
    .app-main {
      flex: 1;
      padding: 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .surface-card {
      background-color: var(--card-white);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
    }

    /* ホーム画面 */
    .home-hero {
      text-align: center;
      padding: 10px 0 20px;
    }

    .home-drone-img {
      width: 156px;
      height: 126px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
      filter: drop-shadow(0 8px 16px rgba(40, 166, 165, 0.22));
    }

    .home-drone-fallback {
      font-size: 68px;
      color: var(--pal-accent);
      margin-bottom: 10px;
      display: inline-block;
    }

    .home-title {
      margin: 0;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: var(--pal-accent);
    }

    .home-menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .home-menu-card {
      background-color: var(--card-soft);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: inset 0 1px 0 #FFFFFF;
    }

    .home-nav-pill {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
    }

    .home-nav-pill.search-pill {
      background: linear-gradient(135deg, var(--pal-accent-light) 0%, var(--pal-accent) 55%, var(--pal-accent-deep) 100%);
      color: #FFFFFF;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.36), 0 4px 0 var(--pal-accent-depth), 0 10px 18px rgba(40, 166, 165, 0.25);
    }

    .home-nav-pill.search-pill:hover {
      filter: brightness(1.04);
    }

    .home-nav-pill.search-pill:active {
      transform: translateY(3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 1px 0 var(--pal-accent-depth), 0 3px 8px rgba(40, 166, 165, 0.2);
    }

    .home-nav-pill.setting-pill {
      background: linear-gradient(135deg, var(--pal-accent-soft-top) 0%, var(--pal-accent-soft-bot) 100%);
      color: var(--pal-text);
      border: 1px solid var(--pal-accent-soft-border);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 4px 0 var(--pal-accent-soft-depth), 0 8px 16px rgba(40, 166, 165, 0.14);
    }

    .home-nav-pill.setting-pill:hover {
      filter: brightness(0.98);
    }

    .home-nav-pill.setting-pill:active {
      transform: translateY(3px);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 0 var(--pal-accent-soft-depth), 0 3px 8px rgba(40, 166, 165, 0.12);
    }

    .home-pill-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .home-pill-left i {
      font-size: 17px;
    }

    .home-note {
      margin: 9px 6px 0;
      font-size: 12px;
      color: var(--pal-text-sub);
      line-height: 1.5;
    }

    /* 探す画面 */
    .search-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .round-input {
      flex: 1;
      min-width: 0;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-white);
      color: var(--pal-text);
      font-size: 14px;
      font-weight: 600;
      box-shadow: inset 0 2px 4px rgba(8, 38, 39, 0.06), 0 1px 0 #FFFFFF;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .round-input::placeholder {
      color: #8ea9ab;
      font-weight: 500;
    }

    .round-input:focus {
      outline: none;
      border-color: var(--pal-accent);
      box-shadow: inset 0 2px 4px rgba(8, 38, 39, 0.06), 0 0 0 3px rgba(40, 166, 165, 0.18);
    }

    /* 立体感＋グラデーション機能別ボタン */
    .btn-decide {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--pal-accent-light) 0%, var(--pal-accent) 55%, var(--pal-accent-deep) 100%);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.36), 0 4px 0 var(--pal-accent-depth), 0 8px 16px rgba(40, 166, 165, 0.25);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
    }

    .btn-decide:hover {
      filter: brightness(1.05);
    }

    .btn-decide:active {
      transform: translateY(3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 1px 0 var(--pal-accent-depth), 0 2px 8px rgba(40, 166, 165, 0.2);
    }

    .btn-search-action {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--pal-accent-light) 0%, var(--pal-accent) 55%, var(--pal-accent-deep) 100%);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), 0 4px 0 var(--pal-accent-depth), 0 10px 18px rgba(40, 166, 165, 0.25);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    .btn-search-action:hover:not(:disabled) {
      filter: brightness(1.05);
    }

    .btn-search-action:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 1px 0 var(--pal-accent-depth), 0 3px 8px rgba(40, 166, 165, 0.2);
    }

    .btn-search-action:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-search-action.is-stop {
      background: linear-gradient(135deg, var(--pal-dark-light) 0%, var(--pal-dark-mid) 55%, var(--pal-text) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 4px 0 #041516, 0 10px 18px rgba(8, 38, 39, 0.28);
    }

    .btn-search-action.is-stop:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn-search-action.is-stop:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 1px 0 #041516, 0 3px 8px rgba(8, 38, 39, 0.22);
    }

    /* カメラ枠と付近の「表示／閉じる」ボタン */
    .camera-block {
      background-color: var(--card-white);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .camera-block.is-searching {
      border-color: var(--pal-accent);
      box-shadow: 0 0 0 2px rgba(40, 166, 165, 0.24), var(--shadow-card);
    }

    .camera-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .camera-toolbar-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      color: var(--pal-text-sub);
    }

    .camera-toolbar-label i {
      font-size: 15px;
      color: var(--pal-accent);
    }

    .btn-camera-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      border-radius: 999px;
      border: 1px solid var(--pal-dark-border);
      background: linear-gradient(180deg, #FFFFFF 0%, var(--pal-dark-soft) 100%);
      color: var(--pal-text);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 #94AEAF, 0 6px 12px rgba(8, 38, 39, 0.12);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .btn-camera-switch:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 0 #94AEAF, 0 2px 6px rgba(8, 38, 39, 0.1);
    }

    .btn-camera-switch.is-closed {
      border-color: var(--pal-accent-soft-border);
      background: linear-gradient(180deg, #FFFFFF 0%, var(--pal-accent-soft-top) 100%);
      color: var(--pal-accent-deep);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 var(--pal-accent-soft-depth), 0 6px 12px rgba(40, 166, 165, 0.16);
    }

    .btn-camera-switch.is-closed:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 0 var(--pal-accent-soft-depth), 0 2px 6px rgba(40, 166, 165, 0.12);
    }

    .camera-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      background-color: var(--pal-text);
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.28);
    }

    .camera-viewport video,
    .camera-viewport canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-viewport canvas {
      pointer-events: none;
    }

    .camera-closed-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--card-soft);
      color: var(--pal-text-sub);
      font-size: 13px;
      font-weight: 700;
    }

    .camera-closed-overlay i {
      font-size: 28px;
      color: var(--pal-text);
    }

    /* 発見通知バー：高さを完全固定してカメラ枠や下の要素が上下に動かないようにする */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--pal-accent-soft-border);
      background: linear-gradient(90deg, var(--pal-accent-soft-top) 0%, var(--pal-primary) 100%);
      color: var(--pal-text);
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 var(--pal-accent-soft-depth);
      transition: opacity 0.15s ease;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--pal-accent) 0%, var(--pal-accent-deep) 100%);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
    }

    .toast-folder-hint {
      font-size: 11px;
      text-decoration: underline;
      font-weight: 800;
      color: var(--pal-accent-deep);
    }

    .status-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--pal-text-sub);
      text-align: center;
      min-height: 18px;
    }

    /* 設定画面 */
    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-field label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      color: var(--pal-text-sub);
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .setting-field label i {
      font-size: 14px;
      color: var(--pal-accent);
    }

    /* カメラID入力とQR読取をまとめたグループ枠 */
    .camera-id-group {
      background-color: var(--card-soft);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 1px 0 #FFFFFF;
    }

    .camera-id-group label {
      margin-bottom: 0;
    }

    .btn-qr-pill {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--pal-accent-soft-border);
      background: linear-gradient(180deg, #FFFFFF 0%, var(--pal-accent-soft-top) 100%);
      color: var(--pal-accent-deep);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 var(--pal-accent-soft-depth), 0 6px 12px rgba(40, 166, 165, 0.14);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .btn-qr-pill:hover {
      filter: brightness(0.98);
    }

    .btn-qr-pill:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 0 var(--pal-accent-soft-depth), 0 2px 6px rgba(40, 166, 165, 0.12);
    }

    .btn-qr-pill.is-stop {
      border-color: var(--pal-dark-border);
      background: linear-gradient(180deg, #FFFFFF 0%, var(--pal-dark-soft) 100%);
      color: var(--pal-text);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 #94AEAF, 0 6px 12px rgba(8, 38, 39, 0.14);
    }

    .btn-qr-pill.is-stop:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 0 #94AEAF, 0 2px 6px rgba(8, 38, 39, 0.12);
    }

    #qr-reader {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
    }

    /* 左右スライド式の単一スイッチ（ツマミ：左＝OFF／右＝ON） */
    .setting-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-soft);
      box-shadow: inset 0 1px 0 #FFFFFF;
    }

    .setting-switch-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .setting-icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: linear-gradient(180deg, #FFFFFF 0%, var(--pal-accent-soft-top) 100%);
      border: 1px solid var(--pal-accent-soft-border);
      color: var(--pal-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      box-shadow: 0 2px 0 var(--pal-accent-soft-depth);
    }

    .setting-switch-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--pal-text);
    }

    .setting-switch-sub {
      font-size: 11px;
      color: var(--pal-text-sub);
      margin-top: 2px;
    }

    .slide-switch-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 82px;
      height: 36px;
      padding: 0;
      border-radius: 999px;
      border: none;
      background: linear-gradient(180deg, #BDD0D1 0%, #94AEAF 100%);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(8, 38, 39, 0.24), 0 2px 0 #FFFFFF;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .slide-switch-btn.is-on {
      background: linear-gradient(135deg, var(--pal-accent-light) 0%, var(--pal-accent) 55%, var(--pal-accent-deep) 100%);
      color: #FFFFFF;
      box-shadow: inset 0 2px 4px rgba(18, 91, 90, 0.3), 0 2px 0 #FFFFFF;
    }

    .slide-switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: linear-gradient(180deg, #FFFFFF 0%, var(--pal-primary) 100%);
      box-shadow: 0 2px 5px rgba(8, 38, 39, 0.25);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ツマミが右にあるとき＝ON状態 */
    .slide-switch-btn.is-on .slide-switch-knob {
      transform: translateX(46px);
    }

    /* ツマミが左にあるときは右側に「OFF」、右にあるときは左側に「ON」を表示 */
    .slide-switch-label {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 0 11px;
      text-align: right;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .slide-switch-btn.is-on .slide-switch-label {
      text-align: left;
    }

    .btn-save-pill {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--pal-accent-light) 0%, var(--pal-accent) 55%, var(--pal-accent-deep) 100%);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.36), 0 4px 0 var(--pal-accent-depth), 0 10px 18px rgba(40, 166, 165, 0.25);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
    }

    .btn-save-pill:hover {
      filter: brightness(1.05);
    }

    .btn-save-pill:active {
      transform: translateY(3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 1px 0 var(--pal-accent-depth), 0 3px 8px rgba(40, 166, 165, 0.2);
    }

    /* 下部ナビゲーション（3タブ） */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 25;
      display: flex;
      gap: 8px;
      padding: 8px 14px;
      background-color: rgba(249, 252, 253, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-soft);
      box-shadow: 0 -6px 20px rgba(8, 38, 39, 0.06);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 7px 6px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--pal-text-sub);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn i {
      font-size: 18px;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, var(--pal-accent-soft-top) 0%, var(--pal-accent-soft-bot) 100%);
      color: var(--pal-text);
      box-shadow: inset 0 1px 0 #FFFFFF, 0 2px 0 var(--pal-accent-soft-depth);
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(8, 38, 39, 0.52);
      backdrop-filter: blur(4px);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 460px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-white);
      box-shadow: 0 18px 40px rgba(8, 38, 39, 0.24);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background-color: var(--card-soft);
      border-bottom: 1px solid var(--border-soft);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: var(--pal-text);
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--card-white);
      color: var(--pal-text);
      box-shadow: 0 2px 0 #C4DADF;
    }

    .btn-clear-history {
      border-color: var(--pal-dark-border);
      background-color: var(--pal-dark-soft);
      color: var(--pal-text);
      box-shadow: 0 2px 0 #94AEAF;
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-soft);
      text-align: center;
      cursor: pointer;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      background-color: var(--card-white);
    }

    .folder-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 800;
    }

    .folder-count {
      font-size: 11px;
      color: var(--pal-text-sub);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--pal-dark-light) 0%, var(--pal-text) 100%);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--pal-text-sub);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--pal-text-sub);
      padding: 24px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 16px;
      border: 2px solid #FFFFFF;
      background-color: #FFFFFF;
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background-color: #FFFFFF;
      color: var(--pal-text);
      font-size: 12px;
      font-weight: 800;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-group">
        <img
          src="drone.png"
          alt="FINDRONE"
          class="header-drone-img"
          onerror="this.style.display='none'; document.getElementById('headerDroneFallback').style.display='inline-flex';"
        />
        <span id="headerDroneFallback" class="header-drone-fallback" style="display: none;">
          <i class="bi bi-bounding-box-circles"></i>
        </span>
        <span class="brand-name">FINDRONE</span>
      </div>
      <button type="button" class="history-top-btn" onclick="openHistoryFolder()" title="発見履歴">
        <i class="bi bi-folder2-open"></i>
        <span>発見履歴</span>
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="surface-card">
          <div class="home-hero">
            <img
              src="drone.png"
              alt="FINDRONE ドローン"
              class="home-drone-img"
              onerror="this.style.display='none'; document.getElementById('homeDroneFallback').style.display='inline-block';"
            />
            <i id="homeDroneFallback" class="bi bi-bounding-box-circles home-drone-fallback" style="display: none;"></i>
            <h1 class="home-title">FINDRONE</h1>
          </div>

          <div class="home-menu-list">
            <div class="home-menu-card">
              <button type="button" class="home-nav-pill search-pill" onclick="goToTab('search')">
                <span class="home-pill-left">
                  <i class="bi bi-search"></i>
                  <span>探す</span>
                </span>
                <i class="bi bi-chevron-right"></i>
              </button>
              <p class="home-note">※探したい物体の名前や特徴から物体検知を行います</p>
            </div>

            <div class="home-menu-card">
              <button type="button" class="home-nav-pill setting-pill" onclick="goToTab('setting')">
                <span class="home-pill-left">
                  <i class="bi bi-gear-fill"></i>
                  <span>設定</span>
                </span>
                <i class="bi bi-chevron-right"></i>
              </button>
              <p class="home-note">※サーバID・カメラIDの設定を行います</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 探す画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="search-stack">
          <div class="surface-card" style="margin-bottom: 0;">
            <div class="search-stack">
              <div class="input-row">
                <input
                  type="text"
                  id="targetObject"
                  class="round-input"
                  placeholder="探す物体を入力"
                  autocomplete="off"
                />
                <button type="button" class="btn-decide" onclick="updateTarget()" title="決定">
                  <i class="bi bi-check-lg"></i>
                  <span>決定</span>
                </button>
              </div>

              <button
                type="button"
                id="startButton"
                class="btn-search-action"
                onclick="startDetection()"
                disabled
              >
                <i class="bi bi-play-fill"></i>
                <span>探索開始</span>
              </button>

              <button
                type="button"
                id="stopButton"
                style="display: none;"
                onclick="stopDetection()"
              >
                探索終了
              </button>

              <!-- 高さを完全固定し、通知の有無でカメラ枠や下の要素が上下に動かないようにする -->
              <div
                id="foundToast"
                class="found-toast"
                title="タップして発見履歴を開く"
                onclick="openFoundObjectFolder()"
              >
                <span id="foundToastText"></span>
                <span class="found-toast-meta">
                  <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
                  <span class="toast-folder-hint">履歴</span>
                </span>
              </div>

              <div id="status" class="status-text">ステータス: 未接続</div>
            </div>
          </div>

          <div id="cameraCard" class="camera-block">
            <div class="camera-toolbar">
              <span class="camera-toolbar-label">
                <i class="bi bi-camera-video-fill"></i>
                <span>カメラ映像</span>
              </span>
              <button
                type="button"
                id="cameraToggleBtn"
                class="btn-camera-switch"
                onclick="toggleCameraView()"
              >
                <i class="bi bi-eye-slash-fill"></i>
                <span id="cameraToggleLabel">閉じる</span>
              </button>
            </div>

            <div class="camera-viewport">
              <video id="video" autoplay muted playsinline></video>
              <canvas id="outputCanvas"></canvas>
              <div id="cameraClosedOverlay" class="camera-closed-overlay" style="display: none;">
                <i class="bi bi-camera-video-off"></i>
                <span>カメラ映像を閉じています</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 設定画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="surface-card">
          <div class="settings-stack">
            <div class="setting-field">
              <label for="serverIp"><i class="bi bi-hdd-network-fill"></i> サーバID</label>
              <div class="input-row">
                <input
                  type="text"
                  id="serverIp"
                  class="round-input"
                  placeholder="サーバIDを入力"
                />
                <button type="button" class="btn-decide" onclick="connectToServerOnly()" title="接続">
                  <i class="bi bi-plug-fill"></i>
                  <span>接続</span>
                </button>
              </div>
            </div>

            <div class="camera-id-group">
              <div class="setting-field" style="margin-bottom: 0;">
                <label for="pcIdInput"><i class="bi bi-webcam-fill"></i> カメラID</label>
                <div class="input-row">
                  <input
                    type="text"
                    id="pcIdInput"
                    class="round-input"
                    placeholder="カメラIDを入力"
                  />
                  <button type="button" class="btn-decide" onclick="connectToPC()" title="接続">
                    <i class="bi bi-plug-fill"></i>
                    <span>接続</span>
                  </button>
                </div>
              </div>

              <button type="button" id="btn-qr" class="btn-qr-pill" onclick="toggleQrScanner()">
                <i class="bi bi-qr-code-scan"></i>
                <span id="qrBtnLabel">QRコード読み取り</span>
              </button>
              <div id="qr-reader" style="display: none;"></div>
            </div>

            <div class="setting-switch-row">
              <div class="setting-switch-left">
                <span class="setting-icon-circle"><i class="bi bi-camera-video-fill"></i></span>
                <div>
                  <div class="setting-switch-title">カメラ常時表示</div>
                  <div class="setting-switch-sub">探す画面を開いたときに映像を表示</div>
                </div>
              </div>
              <button
                type="button"
                id="alwaysCameraBtn"
                class="slide-switch-btn is-on"
                role="switch"
                aria-checked="true"
                onclick="toggleAlwaysCameraSetting()"
              >
                <span class="slide-switch-knob"></span>
                <span id="alwaysCameraStateLabel" class="slide-switch-label">ON</span>
              </button>
            </div>

            <div class="setting-switch-row">
              <div class="setting-switch-left">
                <span class="setting-icon-circle"><i class="bi bi-bell-fill"></i></span>
                <div>
                  <div class="setting-switch-title">通知音</div>
                  <div class="setting-switch-sub">物体を発見したときにサウンド再生</div>
                </div>
              </div>
              <button
                type="button"
                id="notifyToggleBtn"
                class="slide-switch-btn"
                role="switch"
                aria-checked="false"
                onclick="toggleNotificationSetting()"
              >
                <span class="slide-switch-knob"></span>
                <span id="notifyStateLabel" class="slide-switch-label">OFF</span>
              </button>
            </div>

            <div id="connectionStatus" class="status-text">ステータス: 未接続</div>

            <button type="button" class="btn-save-pill" onclick="saveAllSettings()">
              <i class="bi bi-check2-circle"></i>
              <span>設定を保存</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション（3タブ） -->
    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-btn active" onclick="goToTab('home')" title="ホーム">
        <i class="bi bi-house-door-fill"></i>
        <span>ホーム</span>
      </button>
      <button type="button" id="nav-search" class="nav-btn" onclick="goToTab('search')" title="探す">
        <i class="bi bi-search"></i>
        <span>探す</span>
      </button>
      <button type="button" id="nav-setting" class="nav-btn" onclick="goToTab('setting')" title="設定">
        <i class="bi bi-gear-fill"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle">📂 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
