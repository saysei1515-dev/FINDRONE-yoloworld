<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-base: #070d14;
      --bg-surface: #0e1724;
      --bg-elevated: #142032;
      --bg-input: #09121d;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --border-active: rgba(34, 211, 238, 0.55);
      --accent-cyan: #22d3ee;
      --accent-cyan-soft: rgba(34, 211, 238, 0.14);
      --accent-mint: #10b981;
      --accent-mint-soft: rgba(16, 185, 129, 0.16);
      --danger: #f43f5e;
      --danger-soft: rgba(244, 63, 94, 0.16);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
      background: radial-gradient(circle at top, rgba(34, 211, 238, 0.08), transparent 45%), var(--bg-base);
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background-color: rgba(14, 23, 36, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }

    .header-title-group i {
      color: var(--accent-cyan);
      font-size: 18px;
    }

    .header-badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .header-badge-btn:hover {
      border-color: var(--border-active);
      background-color: rgba(34, 211, 238, 0.08);
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background-color: var(--accent-mint);
      color: #042f2e;
      font-size: 11px;
      font-weight: 800;
    }

    /* メイン */
    .app-main {
      flex: 1;
      padding: 18px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ボタン共通 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--border-active);
      background-color: #192940;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      border-color: rgba(34, 211, 238, 0.45);
      background-color: var(--accent-cyan-soft);
      color: #a5f3fc;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: rgba(34, 211, 238, 0.24);
      border-color: var(--accent-cyan);
    }

    .btn.active-stop,
    .btn.is-active-stop {
      border-color: rgba(244, 63, 94, 0.6);
      background-color: var(--danger-soft);
      color: #fda4af;
    }

    .btn-sm {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      white-space: nowrap;
    }

    .btn-block {
      width: 100%;
    }

    /* ホーム画面 */
    .home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
    }

    .drone-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      padding: 24px 20px;
      width: 100%;
      border-radius: var(--radius-lg);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
    }

    .drone-svg {
      width: 84px;
      height: 68px;
      stroke: var(--accent-cyan);
      fill: none;
      stroke-width: 2.5;
    }

    .home-brand-text {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-primary);
    }

    .home-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .home-menu-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .home-action-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.1s ease, background-color 0.15s ease;
    }

    .home-action-card:hover {
      border-color: var(--border-active);
      background-color: var(--bg-elevated);
    }

    .home-action-card:active {
      transform: scale(0.99);
    }

    .home-action-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .home-action-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--accent-cyan-soft);
      color: var(--accent-cyan);
      font-size: 17px;
      flex-shrink: 0;
    }

    .home-action-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .home-action-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .home-action-chevron {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* 探す画面 */
    .search-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .status-chip::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text-secondary);
    }

    .status-chip.is-active {
      border-color: rgba(16, 185, 129, 0.5);
      background-color: var(--accent-mint-soft);
      color: #6ee7b7;
    }

    .status-chip.is-active::before {
      background-color: var(--accent-mint);
    }

    .row-split {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-control {
      flex: 1;
      min-width: 0;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 14px;
      transition: border-color 0.15s ease;
    }

    .input-control::placeholder {
      color: #64748b;
    }

    .input-control:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    /* カメラ枠 */
    .camera-frame-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .camera-frame-box.is-searching {
      border-color: var(--accent-mint);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.25);
    }

    .camera-frame-box video,
    .camera-frame-box canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-frame-box canvas {
      pointer-events: none;
    }

    .camera-overlay-center {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: rgba(7, 13, 20, 0.72);
      backdrop-filter: blur(4px);
    }

    .camera-toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-active);
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .camera-open-mini-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background-color: rgba(14, 23, 36, 0.85);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .camera-open-mini-btn:hover {
      border-color: var(--border-active);
    }

    /* 発見通知バー（高さ固定でレイアウトシフト防止） */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(16, 185, 129, 0.5);
      background-color: var(--accent-mint-soft);
      color: #a7f3d0;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 7px;
      border-radius: 999px;
      background-color: var(--accent-mint);
      color: #042f2e;
      font-size: 11px;
      font-weight: 800;
    }

    .toast-folder-hint {
      font-size: 11px;
      color: #6ee7b7;
      text-decoration: underline;
    }

    .status-line {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: center;
      min-height: 18px;
    }

    /* 設定画面 */
    .setting-screen {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-card {
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setting-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .setting-row-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
    }

    .setting-row-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .on-off-pair {
      display: inline-flex;
      gap: 6px;
      background-color: var(--bg-input);
      padding: 3px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    .mode-pill {
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-pill.is-selected {
      background-color: var(--accent-cyan-soft);
      color: var(--accent-cyan);
    }

    #qr-reader {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    /* 下部ナビゲーション */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 25;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background-color: rgba(14, 23, 36, 0.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-subtle);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 8px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .nav-item i {
      font-size: 18px;
    }

    .nav-item.active {
      color: var(--accent-cyan);
      background-color: var(--accent-cyan-soft);
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(2, 6, 12, 0.78);
      backdrop-filter: blur(4px);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background-color: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }

    .btn-clear-history {
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-elevated);
      text-align: center;
      cursor: pointer;
    }

    .folder-card:hover {
      border-color: var(--border-active);
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background-color: var(--bg-base);
    }

    .folder-name {
      margin-top: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background-color: var(--danger);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-secondary);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-secondary);
      padding: 28px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-active);
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-title-group">
        <i class="bi bi-crosshair"></i>
        <span id="headerTitleText">FINDRONE</span>
      </div>
      <button type="button" class="header-badge-btn" onclick="openHistoryFolder()">
        <i class="bi bi-folder2-open"></i>
        <span>発見履歴</span>
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="home-screen">
          <div class="drone-hero">
            <svg class="drone-svg" viewBox="0 0 100 80" aria-hidden="true">
              <circle cx="22" cy="20" r="12" />
              <circle cx="78" cy="20" r="12" />
              <line x1="31" y1="28" x2="43" y2="39" />
              <line x1="69" y1="28" x2="57" y2="39" />
              <rect x="38" y="36" width="24" height="22" rx="6" />
              <circle cx="50" cy="47" r="4.5" />
              <line x1="42" y1="58" x2="36" y2="68" />
              <line x1="58" y1="58" x2="64" y2="68" />
            </svg>
            <div class="home-brand-text">FINDRONE</div>
            <div class="home-subtitle">リアルタイム物体探索モニター</div>
          </div>

          <div class="home-menu-list">
            <button type="button" class="home-action-card" onclick="goToTab('search')">
              <div class="home-action-left">
                <div class="home-action-icon"><i class="bi bi-search"></i></div>
                <div>
                  <div class="home-action-title">物体を探す</div>
                  <div class="home-action-desc">キーワードを指定してカメラ映像から検知</div>
                </div>
              </div>
              <i class="bi bi-chevron-right home-action-chevron"></i>
            </button>

            <button type="button" class="home-action-card" onclick="goToTab('setting')">
              <div class="home-action-left">
                <div class="home-action-icon"><i class="bi bi-sliders"></i></div>
                <div>
                  <div class="home-action-title">接続・動作設定</div>
                  <div class="home-action-desc">サーバID・カメラID・通知音・表示設定</div>
                </div>
              </div>
              <i class="bi bi-chevron-right home-action-chevron"></i>
            </button>

            <button type="button" class="home-action-card" onclick="openHistoryFolder()">
              <div class="home-action-left">
                <div class="home-action-icon"><i class="bi bi-images"></i></div>
                <div>
                  <div class="home-action-title">発見履歴を見る</div>
                  <div class="home-action-desc">検知した物体のスナップショット一覧</div>
                </div>
              </div>
              <i class="bi bi-chevron-right home-action-chevron"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- ================= 探す（search）画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="search-screen">
          <div class="search-top-bar">
            <div id="searchStatusChip" class="status-chip">
              <span id="searchStatusText">待機中</span>
            </div>
          </div>

          <div class="row-split">
            <input
              type="text"
              id="targetObject"
              class="input-control"
              placeholder="探す物体を入力（例: 水筒、鍵）"
              autocomplete="off"
            />
            <button type="button" class="btn btn-primary btn-sm" onclick="updateTarget()">
              決定
            </button>
          </div>

          <button
            type="button"
            id="startButton"
            class="btn btn-primary btn-block"
            onclick="startDetection()"
            disabled
          >
            探索開始
          </button>

          <button
            type="button"
            id="stopButton"
            style="display: none;"
            onclick="stopDetection()"
          >
            探索終了
          </button>

          <div id="cameraCard" class="camera-frame-box">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>

            <button
              type="button"
              id="cameraToggleBtn"
              class="camera-open-mini-btn"
              onclick="toggleCameraView()"
            >
              <i class="bi bi-camera-video-off"></i>
              <span id="cameraToggleLabel">閉じる</span>
            </button>

            <div id="cameraClosedOverlay" class="camera-overlay-center" style="display: none;">
              <button type="button" class="camera-toggle-pill" onclick="toggleCameraView()">
                <i class="bi bi-camera-video"></i>
                <span>カメラを起動</span>
              </button>
            </div>
          </div>

          <!-- 高さを完全固定し、通知の有無でカメラ枠や下の表示が上下に動かないようにする -->
          <div
            id="foundToast"
            class="found-toast"
            title="タップして発見履歴を開く"
            onclick="openFoundObjectFolder()"
          >
            <span id="foundToastText"></span>
            <span class="found-toast-meta">
              <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
              <span class="toast-folder-hint">履歴を開く</span>
            </span>
          </div>

          <div id="status" class="status-line">ステータス: 未接続</div>
        </div>
      </div>

      <!-- ================= 設定（setting）画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="setting-screen">
          <div class="setting-card">
            <div class="setting-section-title">接続先設定</div>

            <div class="row-split">
              <input
                type="text"
                id="serverIp"
                class="input-control"
                placeholder="サーバIDまたはURLを入力"
              />
              <button type="button" class="btn btn-sm" onclick="connectToServerOnly()">
                接続
              </button>
            </div>

            <div class="row-split">
              <input
                type="text"
                id="pcIdInput"
                class="input-control"
                placeholder="カメラIDを入力"
              />
              <button type="button" class="btn btn-sm" onclick="connectToPC()">
                接続
              </button>
            </div>

            <button type="button" id="btn-qr" class="btn btn-block" onclick="toggleQrScanner()">
              <i class="bi bi-qr-code-scan"></i>
              <span id="qrBtnLabel">QRコード読み取り</span>
            </button>
            <div id="qr-reader" style="display: none;"></div>
          </div>

          <div class="setting-row-box">
            <span class="setting-row-label">通知音</span>
            <div class="on-off-pair">
              <button
                type="button"
                id="notifyOnBtn"
                class="mode-pill"
                onclick="setNotificationEnabled(true)"
              >
                ON
              </button>
              <button
                type="button"
                id="notifyOffBtn"
                class="mode-pill is-selected"
                onclick="setNotificationEnabled(false)"
              >
                OFF
              </button>
              <button
                type="button"
                id="notifyToggleBtn"
                style="display: none;"
                onclick="toggleNotificationSetting()"
              >
                OFF
              </button>
            </div>
          </div>

          <div class="setting-row-box">
            <span class="setting-row-label">カメラ常時表示</span>
            <div class="on-off-pair">
              <button
                type="button"
                id="alwaysCamOnBtn"
                class="mode-pill is-selected"
                onclick="setAlwaysCameraEnabled(true)"
              >
                ON
              </button>
              <button
                type="button"
                id="alwaysCamOffBtn"
                class="mode-pill"
                onclick="setAlwaysCameraEnabled(false)"
              >
                OFF
              </button>
              <button
                type="button"
                id="alwaysCameraBtn"
                style="display: none;"
                onclick="toggleAlwaysCameraSetting()"
              >
                ON
              </button>
            </div>
          </div>

          <button type="button" class="btn btn-primary btn-block" onclick="saveAllSettings()">
            <i class="bi bi-check2-circle"></i>
            <span>設定を保存</span>
          </button>

          <div id="connectionStatus" class="status-line">ステータス: 未接続</div>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション（ホーム／探す／設定） -->
    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-item active" onclick="goToTab('home')">
        <i class="bi bi-house"></i>
        <span>ホーム</span>
      </button>
      <button type="button" id="nav-search" class="nav-item" onclick="goToTab('search')">
        <i class="bi bi-search"></i>
        <span>探す</span>
      </button>
      <button type="button" id="nav-setting" class="nav-item" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle">📂 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
