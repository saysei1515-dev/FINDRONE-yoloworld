<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-pink: #fdf2f8;
      --bg-lavender: #f5f0ff;
      --card-white: #ffffff;
      --card-tint: #faf7ff;
      --border-soft: #eadff7;
      --border-pink: #f3c6e2;
      --text-main: #23192d;
      --text-sub: #766587;
      --grad-cta: linear-gradient(90deg, #db2777 0%, #9333ea 55%, #7c3aed 100%);
      --grad-cta-hover: linear-gradient(90deg, #be185d 0%, #7e22ce 55%, #6d28d9 100%);
      --mint-main: #10b981;
      --mint-dark: #047857;
      --mint-bg: #ecfdf5;
      --mint-border: #a7f3d0;
      --rose-main: #e11d48;
      --rose-bg: #fff1f2;
      --rose-border: #fecdd3;
      --shadow-card: 0 10px 28px rgba(124, 58, 237, 0.08);
      --shadow-cta: 0 8px 20px rgba(147, 51, 234, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background: linear-gradient(160deg, var(--bg-pink) 0%, var(--bg-lavender) 100%);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 82px;
      background: linear-gradient(180deg, rgba(253, 242, 248, 0.75) 0%, rgba(245, 240, 255, 0.85) 100%);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.05);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--grad-cta);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.24);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-main);
    }

    .history-top-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-white);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(124, 58, 237, 0.06);
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .history-top-btn i {
      font-size: 15px;
      color: #9333ea;
    }

    .history-top-btn:active {
      transform: scale(0.97);
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--grad-cta);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
    }

    /* メイン */
    .app-main {
      flex: 1;
      padding: 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .surface-card {
      background-color: var(--card-white);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
    }

    /* ホーム画面 */
    .home-hero {
      text-align: center;
      margin-bottom: 18px;
    }

    .drone-frame {
      width: 88px;
      height: 88px;
      margin: 0 auto 10px;
      border-radius: 22px;
      border: 1px solid var(--border-soft);
      background: linear-gradient(135deg, #fdf2f8 0%, #f5f0ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(147, 51, 234, 0.1);
    }

    .drone-img {
      width: 74px;
      height: 74px;
      object-fit: contain;
      display: block;
    }

    .drone-fallback {
      font-size: 36px;
      color: #9333ea;
    }

    .home-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: var(--text-main);
    }

    .home-menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .home-menu-card {
      background-color: var(--card-tint);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .home-menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 13px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-white);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .home-menu-btn:active {
      transform: scale(0.98);
    }

    .home-menu-btn.cta {
      background: var(--grad-cta);
      border-color: transparent;
      color: #ffffff;
      box-shadow: var(--shadow-cta);
    }

    .home-menu-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background-color: #f5f0ff;
      color: #9333ea;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .home-menu-btn.cta .home-menu-icon {
      background-color: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .home-menu-label-row {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-note {
      margin: 8px 4px 0;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.45;
    }

    /* 探す画面 */
    .search-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .soft-input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 13px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-white);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      box-shadow: inset 0 1px 3px rgba(124, 58, 237, 0.04);
    }

    .soft-input::placeholder {
      color: #a899b8;
      font-weight: 500;
    }

    .soft-input:focus {
      outline: none;
      border-color: #9333ea;
      box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.14);
    }

    .btn-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 16px;
      border-radius: 13px;
      border: none;
      background: var(--grad-cta);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow-cta);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn-cta i {
      font-size: 16px;
    }

    .btn-cta:hover:not(:disabled) {
      background: var(--grad-cta-hover);
    }

    .btn-cta:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-cta:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-cta.is-stop {
      background: linear-gradient(90deg, #f43f5e 0%, #e11d48 100%);
      box-shadow: 0 8px 18px rgba(225, 29, 72, 0.24);
    }

    .btn-ghost-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      border-radius: 13px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-white);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.06);
      transition: transform 0.12s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .btn-ghost-card i {
      font-size: 17px;
      color: #9333ea;
    }

    .btn-ghost-card:active {
      transform: scale(0.98);
    }

    .btn-ghost-card.is-camera-open {
      border-color: var(--mint-border);
      background-color: var(--mint-bg);
      color: var(--mint-dark);
    }

    .btn-ghost-card.is-camera-open i {
      color: var(--mint-main);
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 8px;
    }

    /* カメラ枠 */
    .camera-card {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      border: 1px solid var(--border-soft);
      background-color: #1a1324;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .camera-card.is-searching {
      border-color: var(--mint-main);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25), var(--shadow-card);
    }

    .camera-card video,
    .camera-card canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-card canvas {
      pointer-events: none;
    }

    .camera-closed-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--card-tint);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
    }

    .camera-closed-overlay i {
      font-size: 28px;
      color: #9333ea;
    }

    /* 発見通知バー：高さを完全固定してカメラ枠や下の要素が上下に動かないようにする */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 14px;
      border-radius: 13px;
      border: 1px solid var(--mint-border);
      background-color: var(--mint-bg);
      color: var(--mint-dark);
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 7px;
      border-radius: 999px;
      background-color: var(--mint-main);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
    }

    .toast-folder-hint {
      font-size: 11px;
      text-decoration: underline;
      font-weight: 800;
    }

    .status-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-align: center;
      min-height: 18px;
    }

    /* 設定画面 */
    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-field label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .setting-field label i {
      font-size: 14px;
      color: #9333ea;
    }

    .setting-switch-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-tint);
    }

    .setting-switch-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .setting-icon-box {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background-color: var(--card-white);
      border: 1px solid var(--border-soft);
      color: #9333ea;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .setting-switch-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
    }

    .setting-switch-sub {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .pill-pair {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-white);
      gap: 2px;
      flex-shrink: 0;
    }

    .pill-choice {
      padding: 5px 12px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .pill-choice.is-selected {
      background-color: var(--mint-main);
      color: #ffffff;
    }

    #qr-reader {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
    }

    /* 下部ナビゲーション（3タブ） */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 25;
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-soft);
      box-shadow: 0 -6px 20px rgba(124, 58, 237, 0.06);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 7px 4px;
      border: none;
      border-radius: 13px;
      background: transparent;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn i {
      font-size: 19px;
    }

    .nav-btn.active {
      background-color: #fdf2f8;
      color: #db2777;
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(35, 25, 45, 0.48);
      backdrop-filter: blur(4px);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 460px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-white);
      box-shadow: 0 18px 40px rgba(35, 25, 45, 0.22);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background-color: var(--card-tint);
      border-bottom: 1px solid var(--border-soft);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 5px 10px;
      border-radius: 9px;
      border: 1px solid var(--border-soft);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--card-white);
      color: var(--text-main);
    }

    .btn-clear-history {
      border-color: var(--rose-border);
      background-color: var(--rose-bg);
      color: var(--rose-main);
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background-color: var(--card-tint);
      text-align: center;
      cursor: pointer;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background-color: var(--card-white);
    }

    .folder-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 800;
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-sub);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background-color: var(--rose-main);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-sub);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 24px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 14px;
      border: 2px solid #ffffff;
      background-color: #ffffff;
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 800;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-group">
        <span class="brand-icon-badge"><i class="bi bi-bounding-box-circles"></i></span>
        <span class="brand-name">FINDRONE</span>
      </div>
      <button type="button" class="history-top-btn" onclick="openHistoryFolder()" title="発見履歴">
        <i class="bi bi-folder2-open"></i>
        <span>発見履歴</span>
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="surface-card">
          <div class="home-hero">
            <div class="drone-frame">
              <img
                src="drone.png"
                alt="FINDRONE ドローン"
                class="drone-img"
                onerror="this.style.display='none'; document.getElementById('droneFallback').style.display='inline-flex';"
              />
              <span id="droneFallback" class="drone-fallback" style="display: none;">
                <i class="bi bi-bounding-box-circles"></i>
              </span>
            </div>
            <h1 class="home-title">FINDRONE</h1>
          </div>

          <div class="home-menu-list">
            <div class="home-menu-card">
              <button type="button" class="home-menu-btn cta" onclick="goToTab('search')">
                <span class="home-menu-icon"><i class="bi bi-search"></i></span>
                <span class="home-menu-label-row">
                  <span>探す</span>
                  <i class="bi bi-chevron-right"></i>
                </span>
              </button>
              <p class="home-note">※探したい物体の名前や特徴から物体検知を行います[cite: 1]</p>
            </div>

            <div class="home-menu-card">
              <button type="button" class="home-menu-btn" onclick="goToTab('setting')">
                <span class="home-menu-icon"><i class="bi bi-gear-fill"></i></span>
                <span class="home-menu-label-row">
                  <span>設定</span>
                  <i class="bi bi-chevron-right"></i>
                </span>
              </button>
              <p class="home-note">※サーバID・カメラIDの設定を行います[cite: 1]</p>
            </div>

            <div class="home-menu-card">
              <button type="button" class="home-menu-btn" onclick="openHistoryFolder()">
                <span class="home-menu-icon"><i class="bi bi-folder2-open"></i></span>
                <span class="home-menu-label-row">
                  <span>発見履歴</span>
                  <i class="bi bi-chevron-right"></i>
                </span>
              </button>
              <p class="home-note">※発見した物体一覧が表示されます[cite: 1]</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 探す画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="surface-card">
          <div class="search-stack">
            <div class="input-row">
              <input
                type="text"
                id="targetObject"
                class="soft-input"
                placeholder="探す物体を入力"
                autocomplete="off"
              />
              <button type="button" class="btn-cta" onclick="updateTarget()" title="決定">
                <i class="bi bi-check-lg"></i>
                <span>決定</span>
              </button>
            </div>

            <div class="controls-row">
              <button
                type="button"
                id="startButton"
                class="btn-cta"
                onclick="startDetection()"
                disabled
              >
                <i class="bi bi-play-fill"></i>
                <span>探索開始</span>
              </button>
              <button
                type="button"
                id="cameraToggleBtn"
                class="btn-ghost-card is-camera-open"
                onclick="toggleCameraView()"
              >
                <i class="bi bi-camera-video-off"></i>
                <span id="cameraToggleLabel">閉じる</span>
              </button>
            </div>

            <button
              type="button"
              id="stopButton"
              style="display: none;"
              onclick="stopDetection()"
            >
              探索終了
            </button>

            <!-- 高さを完全固定し、通知の有無でカメラ枠や下の要素が上下に動かないようにする -->
            <div
              id="foundToast"
              class="found-toast"
              title="タップして発見履歴を開く"
              onclick="openFoundObjectFolder()"
            >
              <span id="foundToastText"></span>
              <span class="found-toast-meta">
                <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
                <span class="toast-folder-hint">履歴</span>
              </span>
            </div>

            <div id="status" class="status-text">ステータス: 未接続</div>
          </div>
        </div>

        <div id="cameraCard" class="camera-card">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="outputCanvas"></canvas>
          <div id="cameraClosedOverlay" class="camera-closed-overlay" style="display: none;">
            <i class="bi bi-camera-video-off"></i>
            <span>カメラ映像を閉じています</span>
          </div>
        </div>
      </div>

      <!-- ================= 設定画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="surface-card">
          <div class="settings-stack">
            <div class="setting-field">
              <label for="serverIp"><i class="bi bi-hdd-network-fill"></i> サーバID</label>
              <div class="input-row">
                <input
                  type="text"
                  id="serverIp"
                  class="soft-input"
                  placeholder="サーバIDを入力"
                />
                <button type="button" class="btn-cta" onclick="connectToServerOnly()" title="接続">
                  <i class="bi bi-plug-fill"></i>
                  <span>接続</span>
                </button>
              </div>
            </div>

            <div class="setting-field">
              <label for="pcIdInput"><i class="bi bi-webcam-fill"></i> カメラID</label>
              <div class="input-row">
                <input
                  type="text"
                  id="pcIdInput"
                  class="soft-input"
                  placeholder="カメラIDを入力"
                />
                <button type="button" class="btn-cta" onclick="connectToPC()" title="接続">
                  <i class="bi bi-plug-fill"></i>
                  <span>接続</span>
                </button>
              </div>
            </div>

            <button type="button" id="btn-qr" class="btn-ghost-card" onclick="toggleQrScanner()">
              <i class="bi bi-qr-code-scan"></i>
              <span id="qrBtnLabel">QRコード読み取り</span>
            </button>
            <div id="qr-reader" style="display: none;"></div>

            <div class="setting-switch-box">
              <div class="setting-switch-left">
                <span class="setting-icon-box"><i class="bi bi-camera-video-fill"></i></span>
                <div>
                  <div class="setting-switch-title">カメラ常時表示</div>
                  <div class="setting-switch-sub">探す画面を開いたときに映像を表示</div>
                </div>
              </div>
              <div class="pill-pair">
                <button
                  type="button"
                  id="alwaysCamOnBtn"
                  class="pill-choice is-selected"
                  onclick="setAlwaysCameraEnabled(true)"
                >
                  ON
                </button>
                <button
                  type="button"
                  id="alwaysCamOffBtn"
                  class="pill-choice"
                  onclick="setAlwaysCameraEnabled(false)"
                >
                  OFF
                </button>
                <button
                  type="button"
                  id="alwaysCameraBtn"
                  style="display: none;"
                  onclick="toggleAlwaysCameraSetting()"
                >
                  ON
                </button>
              </div>
            </div>

            <div class="setting-switch-box">
              <div class="setting-switch-left">
                <span class="setting-icon-box"><i class="bi bi-bell-fill"></i></span>
                <div>
                  <div class="setting-switch-title">通知音</div>
                  <div class="setting-switch-sub">物体を発見したときにサウンド再生</div>
                </div>
              </div>
              <div class="pill-pair">
                <button
                  type="button"
                  id="notifyOnBtn"
                  class="pill-choice"
                  onclick="setNotificationEnabled(true)"
                >
                  ON
                </button>
                <button
                  type="button"
                  id="notifyOffBtn"
                  class="pill-choice is-selected"
                  onclick="setNotificationEnabled(false)"
                >
                  OFF
                </button>
                <button
                  type="button"
                  id="notifyToggleBtn"
                  style="display: none;"
                  onclick="toggleNotificationSetting()"
                >
                  OFF
                </button>
              </div>
            </div>

            <div id="connectionStatus" class="status-text">ステータス: 未接続</div>

            <button type="button" class="btn-cta" style="width: 100%; padding: 13px;" onclick="saveAllSettings()">
              <i class="bi bi-check2-circle"></i>
              <span>設定を保存</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション（3タブ） -->
    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-btn active" onclick="goToTab('home')" title="ホーム">
        <i class="bi bi-house-door-fill"></i>
        <span>ホーム</span>
      </button>
      <button type="button" id="nav-search" class="nav-btn" onclick="goToTab('search')" title="探す">
        <i class="bi bi-search"></i>
        <span>探す</span>
      </button>
      <button type="button" id="nav-setting" class="nav-btn" onclick="goToTab('setting')" title="設定">
        <i class="bi bi-gear-fill"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle">📂 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
