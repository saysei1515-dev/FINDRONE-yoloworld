<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      /* 洗練されたティール＆ニュートラル設計 */
      --accent: #1D9A99;
      --accent-hover: #168281;
      --accent-deep: #115E5E;
      --accent-soft: #EBF7F7;
      --accent-border: #C5E8E7;

      --bg-app: #F6F9F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #EEF4F4;
      --bg-warm: #FAF6F2;
      --border-hairline: #E2ECEC;
      --border-strong: #CBDADB;

      --text-main: #0F292A;
      --text-sub: #527072;
      --text-muted: #86A1A3;

      --danger: #E11D48;
      --danger-hover: #BE123C;
      --danger-soft: #FFF1F2;

      --shadow-sm: 0 2px 8px rgba(15, 41, 42, 0.04);
      --shadow-md: 0 8px 24px rgba(15, 41, 42, 0.06);
      --shadow-lg: 0 20px 44px rgba(15, 41, 42, 0.16);
      --focus-ring: 0 0 0 3px rgba(29, 154, 153, 0.16);

      --radius-card: 20px;
      --radius-box: 14px;
      --radius-pill: 999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
      background-color: var(--bg-app);
    }

    /* ヘッダー */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background-color: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hairline);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-drone-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }

    .header-drone-fallback {
      font-size: 20px;
      color: var(--accent);
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--text-main);
    }

    .history-top-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .history-top-btn:hover {
      background-color: var(--bg-subtle);
      border-color: var(--accent-border);
    }

    .history-top-btn:active {
      transform: scale(0.98);
    }

    .history-top-btn i {
      font-size: 13px;
      color: var(--accent);
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      background-color: var(--accent);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
    }

    /* メイン領域 */
    .app-main {
      flex: 1;
      padding: 18px 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .surface-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-card);
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-md);
    }

    /* ホーム画面 */
    .home-hero {
      text-align: center;
      padding: 14px 8px 24px;
      border-bottom: 1px solid var(--border-hairline);
      margin-bottom: 18px;
    }

    .home-drone-img {
      width: 136px;
      height: 112px;
      object-fit: contain;
      display: block;
      margin: 0 auto 14px;
      filter: drop-shadow(0 10px 18px rgba(29, 154, 153, 0.16));
    }

    .home-drone-fallback {
      font-size: 56px;
      color: var(--accent);
      margin-bottom: 12px;
      display: inline-block;
    }

    .home-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.24em;
      color: var(--text-main);
    }

    .home-subtitle {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.04em;
    }

    .home-menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .home-menu-card {
      background-color: var(--bg-app);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-box);
      padding: 14px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .home-menu-card:hover {
      background-color: var(--bg-surface);
      border-color: var(--accent-border);
    }

    .home-menu-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .home-menu-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .home-nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .home-nav-pill.search-pill {
      background-color: var(--accent);
      color: #FFFFFF;
    }

    .home-nav-pill.search-pill:hover {
      background-color: var(--accent-hover);
    }

    .home-nav-pill.setting-pill {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border-color: var(--border-strong);
    }

    .home-nav-pill.setting-pill:hover {
      background-color: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-deep);
    }

    .home-note {
      margin: 8px 0 0;
      font-size: 11.5px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 探す画面 */
    .search-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .round-input {
      flex: 1;
      min-width: 0;
      padding: 11px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .round-input::placeholder {
      color: var(--text-muted);
    }

    .round-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }

    .btn-decide {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 16px;
      border-radius: var(--radius-pill);
      border: none;
      background-color: var(--accent);
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .btn-decide:hover {
      background-color: var(--accent-hover);
    }

    .btn-decide:active {
      transform: scale(0.98);
    }

    .search-action-center {
      display: flex;
      justify-content: center;
    }

    .btn-search-action {
      min-width: 176px;
      padding: 11px 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: var(--radius-pill);
      border: none;
      background-color: var(--accent);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(29, 154, 153, 0.22);
      transition: background-color 0.15s ease, opacity 0.15s ease, transform 0.12s ease;
    }

    .btn-search-action:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-search-action:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-search-action:disabled {
      background-color: var(--border-strong);
      color: #FFFFFF;
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-search-action.is-stop {
      background-color: var(--danger);
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.2);
    }

    .btn-search-action.is-stop:hover:not(:disabled) {
      background-color: var(--danger-hover);
    }

    /* カメラブロック */
    .camera-block {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-card);
      padding: 14px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .camera-block.is-searching {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 154, 153, 0.14), var(--shadow-md);
    }

    .camera-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .camera-toolbar-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .camera-toolbar-label i {
      font-size: 14px;
      color: var(--accent);
    }

    .btn-camera-switch {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid #FECDD3;
      background-color: var(--danger-soft);
      color: var(--danger);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-camera-switch:hover {
      background-color: #FFE4E6;
    }

    .btn-camera-switch.is-closed {
      border-color: var(--accent-border);
      background-color: var(--accent-soft);
      color: var(--accent-deep);
    }

    .btn-camera-switch.is-closed:hover {
      background-color: #DDF2F2;
    }

    .camera-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-box);
      background-color: #0B191A;
      overflow: hidden;
    }

    .camera-viewport video,
    .camera-viewport canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-viewport canvas {
      pointer-events: none;
    }

    .camera-closed-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--bg-subtle);
      color: var(--text-sub);
      font-size: 12.5px;
      font-weight: 600;
    }

    .camera-closed-overlay i {
      font-size: 26px;
      color: var(--text-muted);
    }

    /* 発見通知バー（高さ固定維持） */
    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--accent-border);
      background-color: var(--accent-soft);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 700;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    .found-toast.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .found-toast:hover {
      background-color: #DDF2F2;
    }

    #foundToastText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .found-toast-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .detected-count-badge {
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background-color: var(--accent);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
    }

    .toast-folder-hint {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-deep);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .status-text {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      text-align: center;
      min-height: 18px;
    }

    /* 下部ナビゲーション（3タブ） */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 25;
      display: flex;
      gap: 4px;
      padding: 6px 12px;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-hairline);
    }

    .nav-btn {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 6px;
      border: none;
      border-radius: var(--radius-box);
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .nav-btn i {
      font-size: 17px;
    }

    .nav-btn:hover {
      color: var(--text-sub);
    }

    .nav-btn.active {
      color: var(--accent-deep);
      background-color: var(--accent-soft);
    }

    .nav-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 24%;
      right: 24%;
      height: 2.5px;
      border-radius: 0 0 999px 999px;
      background-color: var(--accent);
    }

    /* 設定画面・モーダル用スタイル */
    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-field label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
      padding-left: 2px;
    }

    .setting-field label i {
      font-size: 13px;
      color: var(--accent);
    }

    .camera-id-group {
      background-color: var(--bg-app);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-box);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .camera-id-group label {
      margin-bottom: 0;
    }

    .qr-action-center {
      display: flex;
      justify-content: center;
    }

    .btn-qr-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--accent-border);
      background-color: var(--bg-surface);
      color: var(--accent-deep);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .btn-qr-pill:hover {
      background-color: var(--accent-soft);
    }

    .btn-qr-pill.is-stop {
      border-color: #FECDD3;
      background-color: var(--danger-soft);
      color: var(--danger);
    }

    #qr-reader {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-hairline);
    }

    .setting-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-box);
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-app);
    }

    .setting-switch-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .setting-icon-circle {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .setting-switch-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .setting-switch-sub {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* モダンなスライドスイッチ（ツマミ：左＝OFF / 右＝ON） */
    .slide-switch-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 74px;
      height: 32px;
      padding: 0;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background-color: #DCE5E5;
      color: var(--text-sub);
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .slide-switch-btn.is-on {
      border-color: var(--accent);
      background-color: var(--accent);
      color: #FFFFFF;
    }

    .slide-switch-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 26px;
      height: 26px;
      border-radius: var(--radius-pill);
      background-color: #FFFFFF;
      box-shadow: 0 1px 4px rgba(15, 41, 42, 0.2);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide-switch-btn.is-on .slide-switch-knob {
      transform: translateX(42px);
    }

    .slide-switch-label {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 0 9px;
      text-align: right;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .slide-switch-btn.is-on .slide-switch-label {
      text-align: left;
    }

    .save-action-center {
      display: flex;
      justify-content: center;
      padding-top: 4px;
    }

    .btn-save-pill {
      min-width: 176px;
      padding: 11px 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: var(--radius-pill);
      border: none;
      background-color: var(--accent);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(29, 154, 153, 0.22);
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .btn-save-pill:hover {
      background-color: var(--accent-hover);
    }

    .btn-save-pill:active {
      transform: scale(0.98);
    }

    /* モーダル */
    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(15, 41, 42, 0.48);
      backdrop-filter: blur(6px);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-card);
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-surface);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 i {
      color: var(--accent);
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--bg-surface);
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .btn-back-folder:hover,
    .btn-close-modal:hover {
      background-color: var(--bg-subtle);
    }

    .btn-close-modal {
      width: 30px;
      height: 30px;
      padding: 0;
    }

    .btn-clear-history {
      border-color: #FECDD3;
      background-color: var(--danger-soft);
      color: var(--danger);
    }

    .btn-clear-history:hover {
      background-color: #FFE4E6;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: var(--radius-box);
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-app);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .folder-card:hover {
      background-color: var(--bg-surface);
      border-color: var(--accent-border);
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background-color: var(--bg-surface);
    }

    .folder-name {
      margin-top: 7px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border-hairline);
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: var(--radius-pill);
      border: 1.5px solid #FFFFFF;
      background-color: var(--danger);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-sub);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 28px 8px;
      font-size: 12.5px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background-color: var(--bg-surface);
      box-shadow: var(--shadow-lg);
    }

    .preview-time-badge {
      margin-top: 12px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--shadow-md);
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-group">
        <img
          src="drone.png"
          alt="FINDRONE"
          class="header-drone-img"
          onerror="this.style.display='none'; document.getElementById('headerDroneFallback').style.display='inline-flex';"
        />
        <span id="headerDroneFallback" class="header-drone-fallback" style="display: none;">
          <i class="bi bi-bounding-box-circles"></i>
        </span>
        <span class="brand-name">FINDRONE</span>
      </div>
      <button type="button" class="history-top-btn" onclick="openHistoryFolder()" title="発見履歴">
        <i class="bi bi-folder2-open"></i>
        <span>発見履歴</span>
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= ホーム画面 ================= -->
      <div id="homeTab" class="tab-content active">
        <div class="surface-card">
          <div class="home-hero">
            <img
              src="drone.png"
              alt="FINDRONE ドローン"
              class="home-drone-img"
              onerror="this.style.display='none'; document.getElementById('homeDroneFallback').style.display='inline-block';"
            />
            <i id="homeDroneFallback" class="bi bi-bounding-box-circles home-drone-fallback" style="display: none;"></i>
            <h1 class="home-title">FINDRONE</h1>
            <p class="home-subtitle">Visual Object Search &amp; Monitoring</p>
          </div>

          <div class="home-menu-list">
            <div class="home-menu-card">
              <div class="home-menu-action-row">
                <span class="home-menu-label">物体を探索する</span>
                <button type="button" class="home-nav-pill search-pill" onclick="goToTab('search')">
                  <i class="bi bi-search"></i>
                  <span>探す</span>
                  <i class="bi bi-chevron-right"></i>
                </button>
              </div>
              <p class="home-note">探したい物体の名前や特徴を指定して、カメラ映像からリアルタイム検知を行います。</p>
            </div>

            <div class="home-menu-card">
              <div class="home-menu-action-row">
                <span class="home-menu-label">接続・通知を調整する</span>
                <button type="button" class="home-nav-pill setting-pill" onclick="goToTab('setting')">
                  <i class="bi bi-sliders"></i>
                  <span>設定</span>
                  <i class="bi bi-chevron-right"></i>
                </button>
              </div>
              <p class="home-note">サーバID・カメラIDの接続設定や、カメラ表示・通知音の動作を調整します。</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 探す画面 ================= -->
      <div id="searchTab" class="tab-content">
        <div class="search-stack">
          <div class="surface-card" style="margin-bottom: 0;">
            <div class="search-stack">
              <div class="input-row">
                <input
                  type="text"
                  id="targetObject"
                  class="round-input"
                  placeholder="探す物体を入力（例：鍵、ボトル、リュック）"
                  autocomplete="off"
                />
                <button type="button" class="btn-decide" onclick="updateTarget()" title="決定">
                  <i class="bi bi-check2"></i>
                  <span>決定</span>
                </button>
              </div>

              <div class="search-action-center">
                <button
                  type="button"
                  id="startButton"
                  class="btn-search-action"
                  onclick="startDetection()"
                  disabled
                >
                  <i class="bi bi-play-fill"></i>
                  <span>探索開始</span>
                </button>
              </div>

              <button
                type="button"
                id="stopButton"
                style="display: none;"
                onclick="stopDetection()"
              >
                探索終了
              </button>

              <div
                id="foundToast"
                class="found-toast"
                title="タップして発見履歴を開く"
                onclick="openFoundObjectFolder()"
              >
                <span id="foundToastText"></span>
                <span class="found-toast-meta">
                  <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
                  <span class="toast-folder-hint">履歴</span>
                </span>
              </div>

              <div id="status" class="status-text">ステータス: 未接続</div>
            </div>
          </div>

          <div id="cameraCard" class="camera-block">
            <div class="camera-toolbar">
              <span class="camera-toolbar-label">
                <i class="bi bi-camera-video"></i>
                <span>カメラ映像</span>
              </span>
              <button
                type="button"
                id="cameraToggleBtn"
                class="btn-camera-switch"
                onclick="toggleCameraView()"
              >
                <i class="bi bi-eye-slash"></i>
                <span id="cameraToggleLabel">閉じる</span>
              </button>
            </div>

            <div class="camera-viewport">
              <video id="video" autoplay muted playsinline></video>
              <canvas id="outputCanvas"></canvas>
              <div id="cameraClosedOverlay" class="camera-closed-overlay" style="display: none;">
                <i class="bi bi-camera-video-off"></i>
                <span>カメラ映像を閉じています</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 設定画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="surface-card">
          <div class="settings-stack">
            <div class="setting-field">
              <label for="serverIp"><i class="bi bi-hdd-network"></i> サーバID</label>
              <div class="input-row">
                <input
                  type="text"
                  id="serverIp"
                  class="round-input"
                  placeholder="サーバIDを入力"
                />
                <button type="button" class="btn-decide" onclick="connectToServerOnly()" title="接続">
                  <i class="bi bi-plug"></i>
                  <span>接続</span>
                </button>
              </div>
            </div>

            <div class="camera-id-group">
              <div class="setting-field" style="margin-bottom: 0;">
                <label for="pcIdInput"><i class="bi bi-webcam"></i> カメラID</label>
                <div class="input-row">
                  <input
                    type="text"
                    id="pcIdInput"
                    class="round-input"
                    placeholder="カメラIDを入力"
                  />
                  <button type="button" class="btn-decide" onclick="connectToPC()" title="接続">
                    <i class="bi bi-plug"></i>
                    <span>接続</span>
                  </button>
                </div>
              </div>

              <div class="qr-action-center">
                <button type="button" id="btn-qr" class="btn-qr-pill" onclick="toggleQrScanner()">
                  <i class="bi bi-qr-code-scan"></i>
                  <span id="qrBtnLabel">QRコード読み取り</span>
                </button>
              </div>
              <div id="qr-reader" style="display: none;"></div>
            </div>

            <div class="setting-switch-row">
              <div class="setting-switch-left">
                <span class="setting-icon-circle"><i class="bi bi-camera-video"></i></span>
                <div>
                  <div class="setting-switch-title">カメラ常時表示</div>
                  <div class="setting-switch-sub">探す画面を開いたときに映像を表示</div>
                </div>
              </div>
              <button
                type="button"
                id="alwaysCameraBtn"
                class="slide-switch-btn is-on"
                role="switch"
                aria-checked="true"
                onclick="toggleAlwaysCameraSetting()"
              >
                <span class="slide-switch-knob"></span>
                <span id="alwaysCameraStateLabel" class="slide-switch-label">ON</span>
              </button>
            </div>

            <div class="setting-switch-row">
              <div class="setting-switch-left">
                <span class="setting-icon-circle"><i class="bi bi-bell"></i></span>
                <div>
                  <div class="setting-switch-title">通知音</div>
                  <div class="setting-switch-sub">物体を発見したときにサウンド再生</div>
                </div>
              </div>
              <button
                type="button"
                id="notifyToggleBtn"
                class="slide-switch-btn"
                role="switch"
                aria-checked="false"
                onclick="toggleNotificationSetting()"
              >
                <span class="slide-switch-knob"></span>
                <span id="notifyStateLabel" class="slide-switch-label">OFF</span>
              </button>
            </div>

            <div id="connectionStatus" class="status-text">ステータス: 未接続</div>

            <div class="save-action-center">
              <button type="button" class="btn-save-pill" onclick="saveAllSettings()">
                <i class="bi bi-check2-circle"></i>
                <span>設定を保存</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション（3タブ） -->
    <nav class="bottom-nav">
      <button type="button" id="nav-home" class="nav-btn active" onclick="goToTab('home')" title="ホーム">
        <i class="bi bi-house-door"></i>
        <span>ホーム</span>
      </button>
      <button type="button" id="nav-search" class="nav-btn" onclick="goToTab('search')" title="探す">
        <i class="bi bi-search"></i>
        <span>探す</span>
      </button>
      <button type="button" id="nav-setting" class="nav-btn" onclick="goToTab('setting')" title="設定">
        <i class="bi bi-gear"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴モーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> 一覧
          </button>
          <h3 id="historyModalTitle"><i class="bi bi-folder2-open"></i> 発見履歴</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()" aria-label="閉じる">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
