<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-grad-1: #fdf2f8;
      --bg-grad-2: #f3e8ff;
      --bg-grad-3: #ecfdf5;
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #4a2c48;
      --text-sub: #8c7388;
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --accent-mint: #10b981;
      --accent-mint-dark: #247a5d;
      --danger: #e11d48;
      --shadow-soft: 0 10px 28px rgba(139, 92, 246, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background: linear-gradient(145deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 52%, var(--bg-grad-3) 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.85);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.25);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--text-main);
    }

    .history-open-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.08);
    }

    .unread-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--accent-pink);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    .app-main {
      flex: 1;
      padding: 14px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-soft);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .card-title i {
      color: var(--accent-purple);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.22);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      font-size: 14px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.14);
    }

    .input-with-btn,
    .search-input-row {
      display: flex;
      gap: 8px;
    }

    .btn-decide,
    .btn-sub {
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.22);
    }

    .found-toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(181, 242, 214, 0.65);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #1f4d3d;
      font-size: 13px;
      font-weight: 700;
    }

    .detected-count-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-mint);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .search-actions-row {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .btn-primary-search {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.25);
    }

    .btn-primary-search.active-stop {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
    }

    .btn-primary-search:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-text {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-align: center;
    }

    .camera-card {
      padding: 10px;
    }

    .camera-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 15px;
      overflow: hidden;
      background: #1e1624;
    }

    .camera-viewport video,
    .camera-viewport canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-viewport canvas {
      pointer-events: none;
    }

    .qr-section {
      margin: 12px 0;
    }

    .btn-qr {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(139, 92, 246, 0.24);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-qr.active-stop {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    #qr-reader {
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
    }

    .setting-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .notify-toggle-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 999px;
      background: #cbd5e1;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .notify-toggle-btn.is-on {
      background: var(--accent-mint);
      color: #fff;
    }

    .btn-save-settings {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(139, 92, 246, 0.22);
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      justify-content: space-around;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.9);
      padding: 6px 8px;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-item i {
      font-size: 18px;
    }

    .nav-item.active {
      color: var(--accent-pink);
      background: rgba(236, 72, 153, 0.1);
    }

    .modal-backdrop,
    .preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(74, 44, 72, 0.45);
      backdrop-filter: blur(6px);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      background: #fff9fc;
      color: var(--text-main);
      border: 1px solid #fff;
      box-shadow: 0 16px 36px rgba(74, 44, 72, 0.22);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background: rgba(253, 242, 248, 0.95);
      border-bottom: 1px solid rgba(139, 92, 246, 0.12);
    }

    .modal-header-left,
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 14px;
    }

    .btn-back-folder,
    .btn-clear-history,
    .btn-close-modal {
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-back-folder {
      background: rgba(139, 92, 246, 0.14);
      color: var(--text-main);
    }

    .btn-clear-history {
      background: rgba(225, 29, 72, 0.14);
      color: var(--danger);
    }

    .btn-close-modal {
      background: rgba(140, 115, 136, 0.15);
      color: var(--text-main);
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
    }

    .folder-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .folder-card {
      position: relative;
      padding: 10px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid rgba(139, 92, 246, 0.14);
      text-align: center;
      cursor: pointer;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #fdf2f8;
    }

    .folder-name {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-sub);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .photo-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
    }

    .corner-delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .photo-time-label {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-sub);
      text-align: center;
    }

    .empty-history-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 24px 8px;
      font-size: 13px;
    }

    .preview-backdrop {
      flex-direction: column;
      z-index: 200;
      background: rgba(30, 16, 29, 0.78);
    }

    .preview-image {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 14px;
      border: 2px solid #fff;
      background: #fff;
    }

    .preview-time-badge {
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
    }

    .preview-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #fdf2f8;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-area">
        <span class="brand-badge"><i class="bi bi-search"></i></span>
        <span class="brand-title">FINDRONE</span>
      </div>
      <button type="button" class="history-open-btn" onclick="openHistoryFolder()">
        <i class="bi bi-folder2-open"></i> 発見履歴
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <main class="app-main">
      <!-- ================= 探索モード画面 ================= -->
      <div id="searchTab" class="tab-content active">
        <div class="glass-card">
          <div class="card-title">
            <i class="bi bi-crosshair"></i> 探すものを指定
          </div>

          <div class="search-input-row">
            <input
              type="text"
              id="targetObject"
              placeholder="探すものを入力（例: 鍵、コップ、リモコン）"
              autocomplete="off"
            />
            <button type="button" class="btn-decide" onclick="updateTarget()">
              決定
            </button>
          </div>

          <div id="foundToast" class="found-toast" style="display: none;">
            <span id="foundToastText"></span>
            <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
          </div>

          <div class="search-actions-row">
            <button
              type="button"
              id="startButton"
              class="btn-primary-search"
              onclick="startDetection()"
              disabled
            >
              PCと接続してください
            </button>
            <button
              type="button"
              id="stopButton"
              style="display: none;"
              onclick="stopDetection()"
            >
              停止
            </button>
          </div>

          <div id="status" class="status-text">ステータス: 初期化中...</div>
        </div>

        <div class="glass-card camera-card">
          <div class="camera-viewport">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>
          </div>
        </div>
      </div>

      <!-- ================= 設定画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="glass-card">
          <div class="card-title">
            <i class="bi bi-sliders"></i> 接続・通知設定
          </div>

          <div class="form-group">
            <label for="serverIp">AIサーバー URL / IP</label>
            <div class="input-with-btn">
              <input
                type="text"
                id="serverIp"
                placeholder="例: https://xxxx.ngrok-free.app または 192.168.1.10"
              />
              <button type="button" class="btn-sub" onclick="connectToServerOnly()">
                登録
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="pcIdInput">PC 接続ID</label>
            <div class="input-with-btn">
              <input
                type="text"
                id="pcIdInput"
                placeholder="PC側のIDを入力またはQR読取"
              />
              <button type="button" class="btn-sub" onclick="connectToPC()">
                接続
              </button>
            </div>
          </div>

          <div class="qr-section">
            <button type="button" id="btn-qr" class="btn-qr" onclick="toggleQrScanner()">
              <i class="bi bi-qr-code-scan"></i> QRコードカメラ起動
            </button>
            <div id="qr-reader" style="display: none;"></div>
          </div>

          <div class="setting-toggle-row">
            <span>発見時の通知音</span>
            <button
              type="button"
              id="notifyToggleBtn"
              class="notify-toggle-btn"
              onclick="toggleNotificationSetting()"
            >
              OFF
            </button>
          </div>

          <div id="connectionStatus" class="status-text">ステータス: 未接続</div>

          <button type="button" class="btn-save-settings" onclick="saveAllSettings()">
            <i class="bi bi-save-fill"></i> この設定で保存
          </button>
        </div>
      </div>
    </main>

    <nav class="nav-bar">
      <button type="button" id="nav-search" class="nav-item active" onclick="goToTab('search')">
        <i class="bi bi-search"></i>
        <span>探索</span>
      </button>
      <button type="button" id="nav-setting" class="nav-item" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> フォルダ一覧
          </button>
          <h3 id="historyModalTitle">📂 発見した物体一覧</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
