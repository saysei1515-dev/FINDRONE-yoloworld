<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINDRONE - 物体探索アプリ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <div class="app-shell">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand-area">
        <span class="brand-badge"><i class="bi bi-search"></i></span>
        <span class="brand-title">FINDRONE</span>
      </div>
      <button type="button" class="history-open-btn" onclick="openHistoryFolder()">
        <i class="bi bi-folder2-open"></i> 発見履歴
        <span id="unreadPhotosBadge" class="unread-badge" style="display: none;">0</span>
      </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="app-main">
      <!-- ================= 探索モード画面 ================= -->
      <div id="searchTab" class="tab-content active">
        <div class="glass-card">
          <div class="card-title">
            <i class="bi bi-crosshair"></i> 探すものを指定
          </div>

          <div id="activeVisualBanner" class="active-visual-banner" style="display: none;">
            <span id="activeVisualLabel"></span>
            <button type="button" class="clear-visual-btn" onclick="clearSelectedVisualItem()">
              解除
            </button>
          </div>

          <div class="search-input-row">
            <input
              type="text"
              id="targetObject"
              placeholder="探すものを入力（例: 鍵、コップ、リモコン）"
              autocomplete="off"
            />
            <button type="button" class="btn-decide" onclick="updateTarget()">
              決定
            </button>
          </div>

          <div id="foundToast" class="found-toast" style="display: none;">
            <span id="foundToastText"></span>
            <span id="detectedCountBadge" class="detected-count-badge" style="display: none;">×0</span>
          </div>

          <div class="search-actions-row">
            <button
              type="button"
              id="startButton"
              class="btn-primary-search"
              onclick="startDetection()"
              disabled
            >
              PCと接続してください
            </button>
            <button
              type="button"
              id="stopButton"
              style="display: none;"
              onclick="stopDetection()"
            >
              停止
            </button>
          </div>

          <div id="status" class="status-text">ステータス: 初期化中...</div>
        </div>

        <div class="glass-card camera-card">
          <div class="camera-viewport">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas>
          </div>
        </div>
      </div>

      <!-- ================= 物体登録モード画面 ================= -->
      <div id="registerTab" class="tab-content">
        <div class="glass-card">
          <div class="card-title">
            <i class="bi bi-plus-circle-fill"></i>
            <span id="registerFormTitle">新しい持ち物を登録</span>
          </div>

          <div class="form-group">
            <label for="registerNameInput">1. 物体の名前を入力</label>
            <input
              type="text"
              id="registerNameInput"
              placeholder="例: 鍵、水筒、ペンケースなど"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label>2. 写真を撮るか、選択する</label>
            <div class="reg-photo-actions">
              <button type="button" class="btn-reg-action" onclick="triggerRegisterCamera()">
                <i class="bi bi-camera-fill"></i> 写真を撮る
              </button>
              <button type="button" class="btn-reg-action secondary" onclick="triggerRegisterGallery()">
                <i class="bi bi-images"></i> 写真を選ぶ
              </button>
            </div>
            <input
              type="file"
              id="registerCameraInput"
              accept="image/*"
              capture="environment"
              style="display: none;"
              onchange="handleRegisterFiles(this.files); this.value='';"
            />
            <input
              type="file"
              id="registerGalleryInput"
              accept="image/*"
              multiple
              style="display: none;"
              onchange="handleRegisterFiles(this.files); this.value='';"
            />
          </div>

          <!-- 見本画像表示エリア（右上に「切り抜く」「削除」ボタン） -->
          <div id="samplePreviewCard" class="sample-preview-card" style="display: none;">
            <div class="sample-preview-header">
              <span id="sampleCounterLabel" class="sample-counter-label">見本 1 / 1</span>
              <div class="sample-top-buttons">
                <button
                  type="button"
                  id="toggleCropModeBtn"
                  class="btn-sample-crop"
                  onclick="toggleCropMode()"
                >
                  <i class="bi bi-crop"></i> 切り抜く
                </button>
                <button
                  type="button"
                  class="btn-sample-delete"
                  onclick="deleteCurrentDraftSample()"
                >
                  <i class="bi bi-trash3-fill"></i> 削除
                </button>
              </div>
            </div>

            <div id="cropStage" class="crop-stage">
              <img id="cropPreviewImg" class="crop-preview-img" alt="見本画像" />
              <canvas id="cropCanvas" class="crop-canvas"></canvas>
            </div>

            <div id="cropActionBar" class="crop-action-bar" style="display: none;">
              <span class="crop-guide-text">指でなぞって切り抜く範囲を指定してください</span>
              <div class="crop-action-buttons">
                <button type="button" class="btn-crop-apply" onclick="applyCropSelection()">
                  切り抜き確定
                </button>
                <button type="button" class="btn-crop-cancel" onclick="cancelCropMode()">
                  やめる
                </button>
              </div>
            </div>

            <!-- 複数枚あるときのサムネイル一覧 -->
            <div id="draftThumbsRow" class="draft-thumbs-row"></div>
          </div>

          <div class="reg-submit-row">
            <button type="button" id="saveRegisteredBtn" class="btn-save-object" onclick="saveRegisteredObject()">
              <i class="bi bi-check-circle-fill"></i> 登録する
            </button>
            <button
              type="button"
              id="cancelEditBtn"
              class="btn-cancel-edit"
              style="display: none;"
              onclick="cancelEditingRegisteredItem()"
            >
              編集キャンセル
            </button>
          </div>
        </div>

        <div class="glass-card">
          <div class="card-title-row">
            <div class="card-title" style="margin-bottom: 0;">
              <i class="bi bi-collection-fill"></i> 登録済みの持ち物
            </div>
            <span id="registerStatus" class="register-status-text">登録済みアイテムはありません</span>
          </div>
          <div id="registeredList" class="registered-list"></div>
        </div>
      </div>

      <!-- ================= 設定画面 ================= -->
      <div id="settingTab" class="tab-content">
        <div class="glass-card">
          <div class="card-title">
            <i class="bi bi-sliders"></i> 接続・通知設定
          </div>

          <div class="form-group">
            <label for="serverIp">AIサーバー URL / IP</label>
            <div class="input-with-btn">
              <input
                type="text"
                id="serverIp"
                placeholder="例: https://xxxx.ngrok-free.app または 192.168.1.10"
              />
              <button type="button" class="btn-sub" onclick="connectToServerOnly()">
                登録
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="pcIdInput">PC 接続ID</label>
            <div class="input-with-btn">
              <input
                type="text"
                id="pcIdInput"
                placeholder="PC側のIDを入力またはQR読取"
              />
              <button type="button" class="btn-sub" onclick="connectToPC()">
                接続
              </button>
            </div>
          </div>

          <div class="qr-section">
            <button type="button" id="btn-qr" class="btn-qr" onclick="toggleQrScanner()">
              <i class="bi bi-qr-code-scan"></i> QRコードカメラ起動
            </button>
            <div id="qr-reader" style="display: none;"></div>
          </div>

          <div class="setting-toggle-row">
            <span>発見時の通知音</span>
            <button
              type="button"
              id="notifyToggleBtn"
              class="notify-toggle-btn"
              onclick="toggleNotificationSetting()"
            >
              OFF
            </button>
          </div>

          <div id="connectionStatus" class="status-text">ステータス: 未接続</div>

          <button type="button" class="btn-save-settings" onclick="saveAllSettings()">
            <i class="bi bi-save-fill"></i> この設定で保存
          </button>
        </div>
      </div>
    </main>

    <!-- 下部ナビゲーション -->
    <nav class="nav-bar">
      <button type="button" id="nav-search" class="nav-item active" onclick="goToTab('search')">
        <i class="bi bi-search"></i>
        <span>探索</span>
      </button>
      <button type="button" id="nav-register" class="nav-item" onclick="goToTab('register')">
        <i class="bi bi-plus-square"></i>
        <span>物体登録</span>
      </button>
      <button type="button" id="nav-setting" class="nav-item" onclick="goToTab('setting')">
        <i class="bi bi-gear"></i>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- 発見履歴フォルダモーダル -->
  <div id="historyFolderModal" class="modal-backdrop" style="display: none;" onclick="closeHistoryFolder()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <button
            type="button"
            id="backToFoldersBtn"
            class="btn-back-folder"
            style="display: none;"
            onclick="backToFolderList()"
          >
            <i class="bi bi-arrow-left"></i> フォルダ一覧
          </button>
          <h3 id="historyModalTitle">📂 発見した物体一覧</h3>
        </div>
        <div class="modal-header-right">
          <button type="button" class="btn-clear-history" onclick="clearGallery()">
            全消去
          </button>
          <button type="button" class="btn-close-modal" onclick="closeHistoryFolder()">
            ✕
          </button>
        </div>
      </div>
      <div id="imageGallery" class="modal-body"></div>
    </div>
  </div>

  <!-- 画像拡大プレビューモーダル -->
  <div id="imagePreviewModal" class="preview-backdrop" style="display: none;" onclick="closePreview()">
    <img id="previewImage" class="preview-image" alt="発見画像プレビュー" onclick="event.stopPropagation()" />
    <div id="previewFoundTime" class="preview-time-badge" style="display: none;"></div>
    <div class="preview-hint">画面をタップして閉じる</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
